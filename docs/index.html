 Reviews_API/api/unsubscribe.js ; currently not deployed.) A dark, branded confirmation page (\"You have been unsubscribed\") opened from the link at the bottom of campaign emails. It shows the email address. The page is only a confirmation: it does not change the customer's marketing consent in Shopify. To really remove someone from the list, change their email marketing status in Customers . 8.6 Shared email layout Reviews_API/api/_email-layout.js builds a light, table-based, inline-styled email (works in Gmail, Apple Mail and Outlook) with the Aurelle name and tagline, cream and gold colors, and a footer with the contact email. Settings: CONTACT_EMAIL , EMAIL_LOGO_URL . It is used by the campaign tool and by the alternative welcome email. 8.7 Merging and deploying Deploying (from the folder that should be live): Install the Vercel CLI ( npm i -g vercel ) and sign in ( vercel login ). In the service folder run vercel --prod . The folder is already linked to the project ( .vercel/project.json ). After deploying check: GET /api/welcome-email should return \"ready\": true , and a POST /api/review with an empty body should answer 401 with a reason . Recommended clean-up (a developer task) Choose one folder (the theme repository's reviews-api/ is the natural home). Copy campaign.js , unsubscribe.js and _email-layout.js into its api/ folder. Decide which welcome-email.js you want (dark layout without unsubscribe link, or the light layout with unsubscribe link). Keep the new review.js (do not copy the old one). Add nodemailer to package.json dependencies (the current reviews-api/package.json lists none, although welcome-email.js needs it). Remove the hard-coded fallback signing string in campaign.js and rely on a real secret. Deploy, then run the checks above. Environment variables are added in Vercel > Project > Settings > Environment Variables (Production), or with vercel env add NAME production , and take effect after the next deployment. A template is in reviews-api/.env.example . 8.8 Security notes Never commit real tokens, secrets or Gmail passwords. .env.local is for local use only and should stay out of Git. The service accepts calls only from the origins in ALLOWED_ORIGINS . The signing secret lives in two places (Vercel and Theme settings). Theme settings can be read by theme editors, so give theme access only to trusted people. Use a Google app password for Gmail, never the account password. Review the Shopify app scopes regularly and keep only the permissions that are needed. ","email-templates":" 9. Email templates Shopify sends automatic emails to customers (order confirmation, shipping, account invitation ...). By default they look generic. This project includes 17 branded versions so every email looks like Aurelle. Where the code is: Email_Templates/email-notification-templates.md (a single file that contains the full ready-to-paste code of every template). Brand used in the emails: Aurelle Fine Jewelry · colors black #111111 , cream #f7f5f0 , gold #9b7c53 · support address info@bssoln.com . These emails are separate from the theme . They are installed in Shopify Admin (Settings > Notifications). A theme change does not alter them. 9.1 The 17 templates # Template When Shopify sends it Subject line 1 Order confirmation Right after a customer pays Your Aurelle order {{ name }} is confirmed 2 Order canceled An order is canceled Your Aurelle order {{ name }} was canceled 3 Order edited You change an order after it was placed Update to your Aurelle order {{ name }} 4 Order refund You refund an order Your Aurelle refund for order {{ name }} 5 Order invoice / draft order invoice You send an invoice Your Aurelle invoice {{ name }} 6 Shipping confirmation You fulfill an order Your Aurelle order {{ name }} is on its way 7 Shipping update The carrier updates the tracking Update on your Aurelle order {{ name }} 8 Out for delivery The parcel is out for delivery Your Aurelle order {{ name }} is out for delivery 9 Delivered The parcel is delivered Your Aurelle order {{ name }} was delivered 10 Local pickup: ready A local pickup order is ready Your Aurelle order {{ name }} is ready for pickup 11 Customer account invite You invite a customer to create an account Activate your {{ shop.name }} account 12 Customer account welcome A customer creates an account Welcome to {{ shop.name }} 13 Customer account password reset A customer asks to reset the password Reset your {{ shop.name }} password 14 Contact customer You email a customer from the order page {{ subject }} 15 Gift card created A gift card is issued You received a gift card from {{ shop.name }} 16 Abandoned checkout (marketing) A customer leaves checkout before paying You left something beautiful behind 17 Newsletter welcome (Shopify Email automation) A new subscriber joins the list Welcome to Aurelle, here is 10% off {{ name }} , {{ shop.name }} and {{ subject }} are Shopify placeholders. Leave them exactly as they are; Shopify replaces them with real values. 9.2 How to install or update a template Do this once per template: Shopify Admin > Settings > Notifications > Customer notifications (for the abandoned checkout email: Marketing ). Click the template name, for example Order confirmation . In the Subject box paste the subject from the table above (the exact text is also in the template file). Click Edit code . Select all the old code (Cmd/Ctrl + A) and delete it. Copy the full code block of that template from email-notification-templates.md , paste it, and click Save . Click Send test email and check the result on mobile and desktop in your inbox. One-time global step (1 minute): Settings > Notifications > Customize : upload the Aurelle logo (transparent PNG, about 160 to 200 px wide). All templates use this logo automatically. Without a logo they show the shop name as text. Template 17: the newsletter welcome automation This one is not code. In Marketing > Automations > Welcome new subscribers > Edit enter: Subject: Welcome to Aurelle, here is 10% off Preview text: Your welcome gift is inside Heading: Welcome to the Aurelle list Body: a thank-you message, the code WELCOME10 and a line about new collections, engraving offers and private sales Button: Shop now linking to the store 9.3 Good to know All styling is inline (required by email apps). Do not expect the theme's CSS to apply. Do not change anything inside {{ ... }} or {% ... %} . You may change the wording around them. Order and shipping templates use Shopify's own variables (for example the engraving property line.properties , and fulfillment.tracking_url ). If a part appears empty in a test, check that the order really has that data (for example a tracking number). The perks strip (\"Free shipping from €39 · 14 days returns · Custom engraving\") is written into the templates. Update the wording if your offers change, or delete that table row. Set Settings > Store details > Customer email to info@bssoln.com so replies reach the right inbox. 9.4 Checklist after installing Logo uploaded in Notifications > Customize All 16 code templates pasted and saved (subject + code) Abandoned checkout and the Welcome automation configured under Marketing Send test email done for each template Discount code WELCOME10 created in Discounts Customer email set to info@bssoln.com 9.5 Two welcome emails? The store has two welcome mechanisms: The Shopify Email automation (template 17), sent by Shopify to new subscribers. The custom welcome email sent by the backend service when the footer or password-page form is submitted ( Backend services ). If both are active, a new subscriber receives two welcome emails with the same code. Keep one of them: either turn off the automation, or stop calling the custom service from the theme. ","catalog-and-data-tools":" 10. Catalog and data tools Everything used to build and fill the store : create collections and menus, import products and photos, create lifestyle product images and prepare logos. These are tools for the BSS team and developers. They change the live store, so use them with care. Safety first. Most scripts talk straight to the live Shopify store. They create, publish or overwrite things (collections, menus, product images). Run them only when you intend to, preferably after exporting a backup (Products > Export) and after trying them on a development or test store. 10.1 What is in the project Item Type What it is scripts/ 14 scripts Collection, menu, image and import automation (below) shopify-catalog-importer/ Web app (Node + Express, Vercel-ready) Browser tool that uploads product photos straight to Shopify and imports products from a CSV products_full.json Data A product catalog of 672 products with variants and images (the source data) shopify_products_eur.csv Data Product import file with EUR prices (full catalog, one row per variant/image) shopify_products_import.csv Data A trimmed product import file shopify_products_import_bdt_english.csv Data The same catalog with BDT prices in English product_images_mapping.csv Data For 351 products : the product title and handle, the current hero image and the recommended name for the second (lifestyle) mockup image mockup_generation_queue.json Data The queue for generating lifestyle mockups: 351 entries with title, handle, category, metal, file name and the image prompt Aurelle_Main_Product_Images.zip Archive The main product photos Aurelle Luxury Theme-1.0.0.zip Archive The first version of the theme, kept as a backup PRODUCT_IMPORT_CLI_GUIDE.md Guide (English) Complete guide to importing products with the Shopify CLI CLI_CATALOG_IMPORT_WORKFLOW_BN.md Guide (Bengali) The enterprise catalog import workflow 10.2 The scripts All scripts live in scripts/ . Unless noted they are run from the project root, for example node scripts/push-collections.js . Scripts that say \"Shopify CLI\" need the Shopify CLI installed and signed in to the store ( shopify store auth ), because they run GraphQL through shopify store execute . Collections and navigation Script What it does Needs push-collections.js Creates the store's collections (Fingerprint Jewelry, Engravable Jewelry/Chains/Rings/Bracelets/Bangles/Earrings, Keychains, Jewellery, Handchains, Chains, Bangles, Bracelets, Earrings, Earring Sets, Rings, Piercings and sub-types, Gentlemen, Outlet, Permanent Jewelry ...). Skips ones that already exist Shopify CLI push-all-collections.py The same, written in Python Python 3, Shopify CLI import-data.js Creates the same set of collections through the Admin API and sets up the dynamic navigation menu An Admin API token ( SHOPIFY_ACCESS_TOKEN or as the first argument) and SHOPIFY_STORE populate-all-collections.js Reads all products and assigns them to the right collections by type, tags and title Shopify CLI publish-all-collections.js Publishes every collection to the Online Store sales channel Shopify CLI update-collection-descriptions.js Writes a description for each collection Shopify CLI push-navigation-menu.js Rebuilds the main (header) menu with top-level items and nested sub-menus Shopify CLI push-footer-menu.js Rebuilds the footer menu Shopify CLI Suggested order for a new store: push-collections.js > import products > populate-all-collections.js > publish-all-collections.js > update-collection-descriptions.js > push-navigation-menu.js > push-footer-menu.js . Images Script What it does Needs download_and_enhance_homepage_images.py Downloads product images used on the home page, enhances them (contrast, sharpness) and saves original and enhanced versions in homepage_product_images/ Python 3 with Pillow, Shopify CLI make_all_logos_transparent.py Turns logo images into cropped transparent PNGs by detecting and removing the background Python 3 with Pillow prepare_mockup_queue.js Reads product_images_mapping.csv and writes mockup_generation_queue.json (the list of lifestyle images to create, with prompts) Node generate_lifestyle_mockups_gemini.js / .py Generates 1024 x 1024 photorealistic lifestyle mockups with Google Gemini / Imagen from the queue and converts them to optimized WebP under 110 KB GEMINI_API_KEY environment variable and cwebp (Python version also google-genai , pillow ). Use --limit N to test a few push_lifestyle_mockups_to_shopify.js Uploads the approved mockups and replaces the second image of each product in Shopify Shopify CLI, a local folder of the generated images Lifestyle image workflow: prepare_mockup_queue.js > generate_lifestyle_mockups_gemini.* (try 5 first) > review the images > push_lifestyle_mockups_to_shopify.js . Some scripts contain file paths of the original developer's computer (for example the project folder or a Downloads folder) and the store address. Edit those lines before running them on another computer or store. 10.3 Catalog importer web app Location: shopify-catalog-importer/ · Built by: BSS · Hosting: runs on any computer, or on Vercel. Why it exists. Normal importers fail with big batches of images because of server size limits (Vercel allows about 4.5 MB per request). This app lets the browser upload the images directly to Shopify's storage , so batches of 1,000+ images work. What it does Connects to any Shopify store with its domain and an Admin API token (needs read_products , write_products , read_files , write_files ) and shows the store name, currency and plan. Reads your product CSV and the images folder . An optional position map CSV says which picture is first, second, third. Without it, file names containing _01-Hero , _02-Lifestyle , _03-Macro are matched. Creates upload targets in Shopify, streams the images from the browser to Shopify, registers them in Shopify Files and records the real cdn.shopify.com addresses. Fills the empty Image Src columns of your CSV with those addresses and lets you download the completed CSV . Optionally creates the products directly (as Draft or Active) with images, variants and EUR prices, using Shopify's productSet . Can also create or check collections. Run it on your computer cd shopify-catalog-importer npm install npm start # then open http://localhost:3000 Deploy to Vercel: npx vercel --prod from the folder (or import the repository in Vercel). Folders: api/index.js (the server and Vercel entry), lib/shopify.js (Shopify GraphQL calls), lib/csvHelper.js (CSV reading and writing), public/ (the dashboard page), sample_data/ (example CSVs and images). The token you type is sent to Shopify through this app. Use it only on a computer or deployment you control, and rotate the token afterwards if it was shared. 10.4 Importing products: the two ways A. Shopify Admin import (fastest for bulk): Products > Import > upload a CSV. The CSV must follow Shopify's product CSV format (handle, title, body, vendor, type, tags, options, variants, SKU, price, image URLs). Images must already be reachable by URL (for example uploaded to Shopify Files first). Multi-variant products repeat the handle on each row. B. Programmatic import: the catalog importer app, or GraphQL calls through the Shopify CLI. The step-by-step version with commands is in PRODUCT_IMPORT_CLI_GUIDE.md (English) and CLI_CATALOG_IMPORT_WORKFLOW_BN.md (Bengali). Image guidelines for jewelry (from the guide): use the same square ratio for every product, a clean \"hero\" shot first, a lifestyle shot second and a macro/detail shot third. Keep files small (WebP under about 110 KB) so pages stay fast. 10.5 Troubleshooting Problem Fix A script says it cannot find shopify Install the Shopify CLI ( npm i -g @shopify/cli ) and sign in to the store \"Access denied\" / missing scope The app or token needs the scope named in the error (for products, collections, files, menus) Products show \"Sold out\" after import Check inventory tracking and quantities in the CSV (columns Variant Inventory Tracker / Qty / Policy ) Images missing after import The image URLs in the CSV were not reachable. Upload the images first and re-run with the CDN addresses A script changed something it should not have Restore the menu or collection manually; this is why a backup export before running is recommended ","maintenance-and-troubleshooting":" 11. Maintenance and troubleshooting For the store team and for any developer who looks after the project. Working on the theme (developer workflow) Tools Shopify CLI ( npm install -g @shopify/cli ) to preview and push the theme. Git : the repository is https://github.com/sifat-99/Jewelry-Shop-i-fy , branch main . Theme Check (a code checker, built into the CLI and the Shopify VS Code extension). Everyday commands Task Command Preview the theme locally with live reload shopify theme dev --store your-store.myshopify.com (opens http://127.0.0.1:9292 ) Check the code for mistakes shopify theme check List the themes of the store shopify theme list --store your-store.myshopify.com Download the live theme (backup) shopify theme pull --store ... --theme <id> Upload your work to a theme shopify theme push --store ... --theme <id> shopify theme dev creates a private development theme in the store and uploads your files to it. It is safe: customers never see it. A development theme that is no longer needed can be deleted in Online Store > Themes. The golden rules Never edit the live theme directly. Work in a development theme or a duplicate, then publish. Keep a backup before big changes: Online Store > Themes > three dots > Duplicate , or shopify theme pull . Commit to Git often with clear messages. At the time of writing there are many uncommitted changes in the working folder. Commit and push them so nothing is lost. Theme editor changes (colors, text, sections) are stored in config/settings_data.json and templates/*.json . If you pull from the store before editing locally you will not overwrite them. After changing a section's {% schema %} , check it in the theme editor (the settings must still open). Test on mobile and desktop and in the theme editor (some sections behave differently there). Code conventions used in this project Custom CSS classes and variables start with lv- (older name of the project). Custom storage keys start with bss_ . Snippets and blocks that are rendered by other files start with a {% doc %} header describing the parameters. Section styles live inside the section file in a <style> block, scoped with the section id. Texts shown to customers should use translation keys ( {{ 'key' | t }} ) from locales/en.default.json . Some older areas still contain English text written directly in the code. Updating and publishing safely Make the change in a development theme. Run shopify theme check . Preview in the browser, desktop and mobile. Check the flows listed in the checklist below. Push to a duplicate of the live theme, preview that. Publish the duplicate (the previous live theme becomes your instant rollback). Rollback Online Store > Themes > find the previous theme > Publish . This takes effect immediately. Pre-launch / release checklist Home page: banner, tiles, collections, reviews show correctly (desktop and mobile) Menu and mega menus open, links work, language switcher works A collection: filters, sorting, grid / list, pagination A product: gallery, zoom, variants, swatches, price and sale badge, size guide link An engravable product: type engraving, change the character option, price updates, text appears in the cart Quick add on a product card (desktop and phone) Cart drawer: add, change quantity, remove (with confirmation), \"Clear all\", free-shipping message, checkout button Checkout opens and shows the right items (checkout is hosted by Shopify) Sign in, account dashboard (orders, addresses, saved) Write a review while signed in (with a photo) and while signed out Newsletter signup: customer created, welcome email received, code works Contact form sends Search: live suggestions and results page Cookie banner appears and works Page titles, descriptions and share previews look right Page speed check (see below) Regular maintenance How often Task Every day Approve or hide new reviews (Content > Metaobjects > Review) Weekly Check the Shopify Admin notifications, app updates and the Vercel dashboard for errors Monthly Test the whole purchase flow once; send a test of the welcome email; check that discount codes still exist When prices or offers change Update the free-shipping amount (see below), the announcement bar, the trust strip, and the email template perks strip Every few months Review who has access to the theme and to Vercel; rotate secrets; update Shopify CLI; review installed apps After every deployment of the backend Run the health checks (see Backend services ) Values written in code These values are not controlled from the theme editor. Changing them needs a developer. Value Where Notes Free-shipping amount (€39, and 4000 for BDT) snippets/cart-drawer.liquid (Liquid at the top of the drawer and again in its JavaScript as 3900 cents / 400000), sections/main-cart.liquid (top of the file) Change all of them together. Also update the texts \"Free shipping from €39\" in the announcement bar, the trust strip ( section-icons ), and the translation strings in locales/en.default.json Address of the welcome email service snippets/footer-newsletter.liquid and sections/main-password.liquid https://your-reviews-service.vercel.app/api/welcome-email Default address of the review service snippets/product-review-summary.liquid and the default of the Reviews API URL setting https://your-reviews-service.vercel.app/api/review Default SEO description of the home page layout/theme.liquid Used when the store has no description in Preferences Browser theme color layout/theme.liquid ( theme-color ) #000000 Contact e-mail defaults sections/main-page.liquid , templates/page.contact.json , templates/page.faq.json info@bssoln.com and store.bssoln@gmail.com Instagram fallback link sections/instagram-feed.liquid https://www.instagram.com/bssoln Footer credit \"Developed by Bangladesh Software Solution\" sections/footer-group.json (the subfooter extra text) Editable in the theme editor, in the Subfooter section Welcome discount code Backend ( WELCOME_DISCOUNT_CODE , default WELCOME10 ), footer newsletter settings, email templates Must match a real discount in Shopify Store domain in scripts _project_resources/scripts/* your-store.myshopify.com Local file paths in scripts _project_resources/scripts/*.py , _project_resources/scripts/*.js Paths on the original developer's computer Known issues # Issue Impact Suggested fix 1 Reviews: first 50 only. Liquid reads at most 50 metaobject entries of a type Once the store has more than 50 reviews, lists, averages and counts become wrong Move to Storefront API with pagination, or store a rating summary per product (metafield) 2 Backend folders split. Campaign and unsubscribe code exist in Reviews_API , but the live service was deployed from reviews-api Campaign tool and unsubscribe page are offline; welcome email has no unsubscribe link Merge into one folder and redeploy ( Backend services ) 3 Campaign tool access check is weak If deployed as is, anyone who adds ?shop=... to its address could send emails to all subscribers Verify Shopify's signed request before deploying 4 nodemailer is missing from reviews-api/package.json A clean install may fail to load the welcome email endpoint Add it as a dependency 5 Two welcome emails (Shopify automation and the custom service) Subscribers may receive both Keep one 6 Category metafields on the product page are unfinished ( product-category-metafields.liquid only writes an HTML comment) Nothing is shown Finish or remove the snippet and its call in main-product.liquid 7 Wishlist is stored in the browser Not shared across devices, lost when browser data is cleared Use customer metafields or an app if a persistent wishlist is needed 8 Seven newer review pop-up texts exist in English only (sign-in panel and the locked product label; keys under products.reviews : login_title , login_lead , login_button , register_button , unavailable , reviewing_as , field_product_fixed ) Dutch visitors see the English wording for those texts Add the keys to locales/nl.json 9 Reviews are never marked verified automatically No automatic verified-buyer badge Check orders in the service (needs read_orders ) 10 One review per customer per product is not enforced A customer can submit several Add a check in the review service 11 Large files: assets/theme.css (about 520 KB) and assets/theme.js (about 430 KB) Slower first load on slow phones Remove unused code, split by page 12 Theme Check reports about 13 errors and 22 warnings (snapshot at the time of writing) Mostly code-style and schema warnings, no customer impact seen Run shopify theme check and fix gradually 13 Signing secret stored in Theme settings ( config/settings_data.json ) which is part of the Git repository Anyone with repository access can read it Rotate the secret if the repository is ever shared; keep the repository private 14 Unused assets ( valoire_header_logo_...jpg , several product and lifestyle images) Only clutter Remove after confirming Troubleshooting guide Storefront Symptom Likely cause What to do A section does not appear It is hidden (eye icon) or the template does not include it Open the page in Customize and check the section list Changes in the editor do not show on the live store Not saved, or you edited a different theme Click Save; check you are in the live theme Pictures look blurry or cropped Wrong aspect ratio or too small Upload larger images with the recommended ratio shown in the setting Text is unreadable on a banner Photo too bright/dark Use the section's overlay or the text color settings Prices show without currency code Setting is off Theme settings > Price & Badges > Show currency codes Cart drawer does not open A JavaScript error stopped the page scripts Open the browser console (F12), fix the error. Often caused by pasted code in Custom CSS or announcement HTML Free-shipping message is wrong Value is written in code See \"Values written in code\" Engraving field missing Product not recognized as engravable Check keywords in Theme settings > Engraving, or name an option \"Engraving characters\" Quick view button missing It is switched off Theme settings > Product Card > Enable Quick View modal Wishlist hearts disappear Browser data cleared Expected behavior (stored in the browser) Mega menu has no pictures No image blocks added Add Navigation Item Image blocks in the Header section Reviews missing Draft status, or more than 50 reviews See the Reviews chapter Services Symptom Likely cause What to do Review pop-up says \"Please sign in\" Secret mismatch, expired or missing Read the Reason in the browser console and follow Reviews troubleshooting Review service says \"Origin not allowed\" The site is not in ALLOWED_ORIGINS Add it in Vercel and redeploy Welcome email not received Gmail credentials missing, or the email is in spam Open https://your-reviews-service.vercel.app/api/welcome-email and check ready: true ; check the Vercel logs Vercel function errors Missing environment variable or dependency Vercel > Project > Logs Quick health checks # Welcome email service (should say \"ready\": true) curl https://your-reviews-service.vercel.app/api/welcome-email # Review service rejects unsigned requests (should answer 401 with a \"reason\") curl -X POST https://your-reviews-service.vercel.app/api/review \\ -H \"Content-Type: application/json\" -H \"Origin: https://shopify-jewelry.bssoln.com\" -d \"{}\" Performance and quality tips Use WebP/JPEG images, around 1600 px wide for banners, and compress them. Short, compressed videos only. Avoid adding many apps; each adds scripts to every page. Keep the number of sections on the home page reasonable; the page scrolls through many images. Run Google PageSpeed Insights on the home, a collection and a product page after big changes. Do not put secrets in the theme code, the announcement HTML or Custom CSS. Everything in the theme is visible to visitors. Security and access Give staff accounts only the permissions they need. Theme editors can read theme settings. Keep the Vercel project, the Shopify custom app credentials and the Gmail app password with the owner/BSS only. Rotate the Review signing secret and Shopify app secrets if anyone with access leaves. Keep .env and .env.local files out of Git (they are listed in .gitignore ). Support BSS Software Solutions · https://bssoln.com · info@bssoln.com ","glossary-and-faq":" 12. Glossary and FAQ Glossary Term Plain meaning Theme The design and layout of the online store. This project's theme is called \"Jewelry Shop\" Theme editor / Customize The visual editor in Shopify Admin where you change the store without code Section A large building block of a page (banner, product grid, footer) Block A repeatable item inside a section (a slide, a tile, a message) Template The recipe of a page type: which sections it has and in which order Section group A list of sections shown on every page (the header group and the footer group) Snippet A small reusable piece of the theme, used by sections. Developers only Liquid Shopify's template language. The theme is written in it Theme settings Store-wide design controls (colors, fonts, buttons). Different from section settings Color scheme A named set of colors (background, text, button, border) that a section can use Palette One-click set of brand colors that fills the color schemes Metaobject A custom data record stored in Shopify. Reviews are stored as metaobjects of type review Metafield An extra field on a product, customer or order Draft / Active The status of a review: Draft is hidden, Active is published Variant One version of a product (for example size 18 cm in gold) Line item property Extra information attached to a cart item, such as the engraving text Compare-at price The old (higher) price; setting it creates a sale Quick add A button on a product card to add to cart without opening the product Quick view A pop-up with product details opened from a card Wishlist Saved favorite products (heart button) Cart drawer The cart that slides in from the right Mega menu A large dropdown menu with columns and pictures Skeleton A placeholder that shimmers while images load Serverless function A tiny program hosted online that runs only when called (Vercel). Used for reviews and emails Vercel The hosting service of the backend services API A way for one program to talk to another Environment variable A private setting of a hosted service (passwords, addresses) Token / signing secret A private code used to prove who is calling (for example that a customer is signed in) CORS / allowed origins A safety rule that says which websites may call a service Shopify CLI The command-line tool developers use to preview, upload and automate the store Dev store / development theme A safe copy for testing Gmail app password A special password Google issues so that a program can send email through a Gmail account SMTP The standard way programs send email FAQ Design and content How do I change the colors of the whole store? Theme settings > Theme Palette > choose a palette (Champagne Gold, Rose Gold, Platinum, Emerald, Midnight) or Custom. See Design and settings guide . How do I change the banner on the home page? Customize > Home page > Homepage banner > the Slide block. See Store owner guide . Can I add a new section to a page? Yes: Customize > open the page > Add section . The available sections are listed in the Sections guide . Can I have different banners on desktop and mobile? Yes. Banners and tiles have separate desktop and mobile images/videos. Where do I change the menu? Content > Menus . Pictures and dropdown style are in the Header section. Why does my change not show on the website? Click Save in the editor, and check you are editing the live (published) theme. How do I go back if something breaks? Online Store > Themes: publish the previous theme copy. Keep a duplicate before big changes. Products and shopping How do I make a product engravable? Put a keyword (engrav, personali) in the title, type or tags, or add an option named like \"Engraving characters\". See Custom engraving . How is the engraving price calculated? By variants: each \"characters\" option value (3, 5, 7, 10, 12) is a variant with its own price. Where do customers see the engraving text? In the cart, the cart drawer, the order and the order emails, as a line item property. How do I create a sale? Set the compare-at price above the price. The sale badge appears automatically. Colors and style are in Theme settings > Price & Badges. Can I change the free-shipping amount? It is written in the code, so a developer must change it in several places. See Maintenance > Values written in code . Why do some product cards show a \"Personalise\" bar instead of sizes? Because the product is engravable. The button opens a pop-up with the engraving field. Does the wishlist work across devices? No. It is saved in the browser of each device. Reviews Who can write a review? Only customers who are signed in. Where do I approve reviews? Content > Metaobjects > Review. Set the status to Active. Can I choose how reviews look? Yes, Theme settings > Reviews > Review card layout (eight designs). Why can't customers submit reviews? See the troubleshooting table in the Reviews system . Emails and marketing How are the order emails styled? With the 17 branded templates pasted into Settings > Notifications. See Email templates . What happens when someone subscribes to the newsletter? Shopify saves them as a customer with marketing consent and the tag \"newsletter\", and the welcome email service sends them the discount code. Does the discount code in the email work automatically? Only if the same code exists in Discounts . How do I send a campaign? With the campaign tool (see Backend services ). It is currently not deployed. Technical Where is the code stored? The theme: the Git repository Jewelry-Shop-i-fy . The backend: the folders reviews-api and Reviews_API . What is hosted outside Shopify? The review and welcome-email services on Vercel ( your-reviews-service.vercel.app ). Who do I contact for changes? BSS Software Solutions, https://bssoln.com , info@bssoln.com . ","start":" Aurelle Fine Jewelry: Store Documentation Complete documentation of the Aurelle online store: the Shopify theme, every custom section and feature, and every custom application built around it. Theme: Jewelry Shop v2.0.0 · Built by: BSS Software Solutions (Bangladesh Software Solutions) · Store: Aurelle Fine Jewelry (Shopify) This documentation is written in plain English so that a store owner, a content editor and a developer can all find what they need. Developer details are always in a separate \"For developers\" part, so non-technical readers can skip them. Start here If you are... Read this first The store owner / client : you want to understand what you have and what it can do 1. Project overview , then 6. Custom features Editing content every day : banners, products, menus, reviews, emails 2. Store owner guide Changing the look : colors, fonts, buttons, product cards 3. Design and settings guide A developer taking over the project 1. Project overview , Theme architecture , 8. Backend services , 11. Maintenance Contents Guides # Document What you will find 1 Project overview Everything that is part of the project, how the pieces connect, the design system, the folder map 2 Store owner guide Step-by-step \"how do I...\" recipes for daily work 3 Design and settings guide The global design controls in plain language: palette, fonts, buttons, cards, prices 4 Pages and templates Every page type and which sections it contains 5 Sections guide All 32 sections with a page for each one (every setting explained) 6 Custom features The special features: engraving, cart drawer, quick view, wishlist, mega menu, size guide and more 7 Reviews system How customer reviews work end to end: designs, the form, sign-i n-search , sections/parallax-showcase , sections/section-collection +1 more SJ product-grid-vars Outputs the inline CSS variables for .lv-product-grid (see assets/product-grid.css). Accepts: settings (section.settings). Optional defaults: d_xl, d_1024, d_960, d_768, d_650,... sections/collection-split , sections/main-collection , sections/main-search , sections/section-collection -- card-mini-add Compact \"add\" button for product cards at Product Card > Compact add... snippets/product-grid-item -- card-mini-add-assets Global CSS + JS for the compact card add button and its variant popup (bottom sheet / side drawer / above button / over product). Rendered once from layout/theme.liquid. layout/theme SJ card-engrave-bar Hover bar for engravable products on product cards: a plain text button instead of the size/variant pills. Clicking it opens the variant + engraving popup or goes to the... snippets/product-grid-item -- quick-view-modal The \"quick view\" pop-up opened from a product card: gallery, price, variants, engraving and add to cart without leaving the page. layout/theme SJ cart-drawer The slide-out cart that opens from the header bag icon. It shows a free-shipping progress message, every item with quantity buttons, a trash button with a confirmation, a \"Clear all\" link, engraving details and the checkout button. It updates the cart without reloading the page. Checkout button style: Theme settings > Cart & Drawer. The free-shipping threshold is currently written inside this file (see \"Hard-coded values\" in the maintenance guide). layout/theme SJ cart-line-items The markup of the cart items (image, title, variant, properties such as the engraving text, price, quantity stepper, remove button). Shared by the cart drawer, the cart page and the cart helper section. sections/api-cart-items , snippets/cart-drawer -- cart-subtotal Small piece of markup that shows the cart subtotal. Used with the cart helper section so totals refresh instantly. sections/api-cart-sub ttings. sections/customer-feedback , sections/product-reviews -- feedback-bubble A customer review shown as a speech bubble (text + stars) with the customer's avatar, name and date below it. Used by the \"Speech bubble slider\" review design in sections/customer-feedback.liquid and sections/product-reviews.liquid. Colors come from the section's color scheme (--bg, --text) and the theme accent (--cf-accent). sections/customer-feedback , sections/product-reviews , snippets/feedback-bubble S- feedback-stats Average rating + count for the customer feedback section. Accepts: use_meta (true/false), entries (metaobject list), blocks (section.blocks), limit Output: average ~~ count sections/customer-feedback -- review-form Renders a product review button and a configurable review submission dialog. snippets/product-review-summary SJ review-parallax-script Adds subtle scroll speed differences to review cards in the parallax wall layout. sections/customer-feedback , sections/product-reviews -J Header, navigation and search Snippet What it does Used by CSS/JS header-account-avatar Renders the customer account avatar in the header or account dashboard: custom/Shop profile image when available, uppercase initial fallback when no image exists, or the guest account SVG icon when logged out. sections/header , sections/main-account-dashboard , snippets/header-account-avatar -- header-language-switcher Renders a header localization language switcher backed by Shopify's native localization form and Translate & Adapt locales. sections/header , snippets/header-language-switcher -- header-mega-menu Builds the dropdown (mega menu) panels under the main navigation, using the \"Custom Mega Menu\" and \"Navigation Item Image\" blocks of the header section. snippets/nav-item -- nav-item One entry of the desktop main menu, including its dropdown. sections/header -- nav-item-mobile One entry of the mobile menu drawer, including expandable sub-menus. sections/header -- country-flag Renders a crisp, sharp-cornered inline SVG country flag for a given locale or language ISO code (e.g. en , nl , de , fr , en-US ). Uses pure filled shapes with no strokes or clipPath IDs to avoid CSS stroke overrides or ID collisions. snippets/country-flag , snippets/header-language-switcher -- search-predictive Snippet \"search-predictive\" used by the theme sections. sections/header , layout/theme SJ breadcrumb Global breadcrumb. Style + visibility come from Theme settings > Breadcrumbs. Accepts: current (text, required), parent_title / parent_url (optional middle crumb) Renders: Home... sections/main-account-dashboard , sections/main-article , sections/main-blog , sections/main-cart , sections/main-collection +4 more S- Banners, showcases and page layouts Snippet What it does Used by CSS/JS banner-media Shared banner media renderer (image OR video, desktop + mobile versions). Used by: sections/section-slideshow.liquid, sections/collection-banner.liquid Accepts: - settings :... sections/collection-banner , sections/section-mosaic , sections/section-slideshow -- banner-overlay Banner dark overlay. Accepts: - opacity : 0-80 (percent strength) - style : 'full' (flat overlay over the whole banner) | 'gradient' (smooth fade only behind the text) -... sections/collection-banner , sections/section-mosaic , sections/section-slideshow -- banner-text-style Inline CSS variables for the banner text when \"Text color\" = Custom colors. Accepts: settings (block.settings or section.settings) Button colours go through the theme's... sections/collection-banner , sections/section-slideshow -- banner-video Renders a single Shopify-hosted background for banners. Accepts: video (Shopify video object), device (all | desktop | mobile), focus, target_width, alt - Picks ONE mp4... snippets/banner-media -- showcase-video Renders an autoplaying muted looping video inside a custom `` controller with an accessible pause/play toggle button and optional link wrapper. sections/collection-split , snippets/product-showcase-render , snippets/showcase-video S- split-showcase-banner Renders an animated multi-product moving showcase banner using ``. Supports fade+zoom or slide transitions, hover/offscreen pause, touch swipe, optional product title/price caption, and pagination dots. sections/collection-split , snippets/product-showcase-render , snippets/split-showcase-banner S- product-showcase-render Shared renderer for the Product Showcase layout (editorial text + bleed carousel or sticky portrait media + responsive product grid). Adapted to the theme's global color scheme tokens ( --bg , --text , --color-foreground , --color-background ), button animations, and product-grid-item cards. Used by both sections/product-showcase.liquid and the \"new\" design style of sections/collection-split.liquid . sections/collection-split , sections/product-showcase SJ about-story About us landing layout with auto-rotating product secondary images slideshow. Accepts: blocks, cfg (section.settings), page_title, page_content sections/main-page SJ service-landing Permanent Jewelry On-Site Landing Layout with Auto-Rotating Atelier Showcase. Accepts: blocks, cfg (section.settings), page_title, page_content sections/main-page SJ faq-accordion FAQ layout: category list + search on the left, animated accordion on the right, contact CTA. Accepts: blocks (section.blocks of type 'faq'), cfg (section.settings) sections/main-page SJ footer-newsletter Newsletter signup band at the top of the footer. Uses Shopify's built-in customer form (the email becomes a Customer with email marketing consent + tag \"newsletter\"). Settings:... sections/footer SJ Customer account Snippet What it does Used by CSS/JS account-order-modal Renders an in-dashboard modal dialog containing complete details for a customer order (statuses, fulfillments/tracking, line items with properties, price breakdown, addresses, payment transactions, notes, and custom attributes). sections/main-account-dashboard , snippets/account-order-modal -- account-order-row Renders one order row (number, date, thumbnails, status pills, total, action) for the customer account dashboard. sections/main-account-dashboard , snippets/account-order-row -- Global styling, typography and utilities Snippet What it does Used by CSS/JS css-variables Prints the theme's design tokens as CSS variables in the page head (colors, radii, spacing, typography sizes) from Theme settings. Every section reads these variables, which is why one setting can restyle the whole store. layout/theme S- theme-typography Resolves global luxury jewelry typography presets and custom font selectors. Use part: 'head' in before css-variables to load active Google/Shopify fonts, and part: 'vars' inside :root {} in css-variables / password layout. snippets/css-variables , snippets/theme-typography , layout/password , layout/theme S- typography-font-meta Returns font metadata for a curated jewelry typography key. Output format: gf_spec css_stack category auto_weight auto_heading_ls auto_transform italic_stack snippets/theme-typography , snippets/typography-font-meta -- custom-button-animations The global button and control styling system: every button (primary, outline, round, add to cart, quantity selector, pagination ...), the sliding fill hover animation, input styling and many small interface details. Driven by Theme settings > Buttons & Controls. layout/password , layout/theme SJ button-fill-slide Sliding fill variant of the button hover (Theme settings > Buttons & Controls > \"Sliding fill animation on hover\"). Generated from the ::before fill rules; turns the default... layout/theme S- loading-states Global loading states: image skeleton on product cards + animated loader on the product page gallery. Settings: Theme settings > Loading & skeleton. layout/theme SJ lv-loader Animated brand loader - Aurelle luxury jewelry streaming marquee featuring delicate chain necklace medallion, eternity band ring, and marquise solitaire drop charm. Colours match global theme accent (--lv-accent-deep, #806745). Continuous horizontal stream motion from right to left. sections/main-collection , sections/main-product , snippets/product-grid-item , snippets/quick-view-modal -- landing-css Shared CSS for landing-style pages (permanent jewelry, about us). snippets/about-story , snippets/service-landing S- pagination Page numbers and previous / next arrows used under product grids and blog lists. sections/main-article , sections/main-blog , sections/main-collection , sections/main-search -- pagination-css Outputs the shared pagination styles (.lv-pagination*). Rendered by the pagination snippet and by the collection page's per-page pager. sections/main-collection , snippets/pagination-css , snippets/pagination S- policy-page-css Styles Shopify's built-in /policies/* pages (refund, shipping, privacy, terms) to match the theme. layout/theme S- cookie-banner-css Styles Shopify's native Customer Privacy cookie consent banner (#shopify-pc__banner) and preferences dialog (#shopify-pc__prefs) to match the storefront's luxury design system. snippets/cookie-banner-css , layout/theme S- social-meta-tags Adds Open Graph and Twitter card tags so links to the store look good when shared on social media and messaging apps. layout/theme -- icon Renders an SVG icon. Usage: render 'icon', icon: 'bag' sections/main-search , snippets/icon -- Note: product-category-metafields is unfinished: it currently only writes an HTML comment listing the product's category metafield keys (a debug helper) and shows nothing to customers. See the maintenance guide. ","ref-theme-architecture":" Theme architecture (for developers) How the theme is put together, so a developer can find things quickly. 1. From request to page Browser requests /products/some-ring │ Shopify picks the TEMPLATE templates/product.json │ (an ordered list of sections + their settings) ▼ layout/theme.liquid ── wraps every page <head> SEO tags · fonts · CSS variables · stylesheets · global snippets <body> {% sections 'header-group' %} → announcement, header {{ content_for_layout }} → the template's sections {% sections 'footer-group' %} → footer, subfooter search popdown · cart drawer · quick view modal scripts vendor.js · theme.js · banner.js Templates ( templates/*.json ) only list sections and their saved settings. They are rewritten by the theme editor. templates/customers/*.liquid and templates/gift_card.liquid are plain Liquid templates. Sections ( sections/*.liquid ) contain the markup, a scoped <style> block, optional <script> , and a {% schema %} that defines the editor settings and blocks. Snippets ( snippets/*.liquid ) are rendered with {% render 'name', param: value %} . They cannot see variables of their parent unless passed in. Most start with a {% doc %} header that lists the parameters. There is no blocks/ folder. All repeatable items are section blocks (defined in each section's schema). 2. What layout/theme.liquid does, in order Meta tags, canonical URL, favicon, page title (page + tags + page number + shop name), meta description (with an Aurelle default on the home page). social-meta-tags (Open Graph / Twitter). theme-typography (part head ): loads the chosen Google/Shopify fonts. font-settings.css , css-variables (design tokens), theme.css , banner.css , product-grid.css . An inline <style> block that generates: the color schemes : for every scheme in Theme settings a .color-scheme-N class with --bg , --text , button and border variables; the palette variables --lv-ivory , --lv-cream , --lv-sand , --lv-ink , --lv-dark , --lv-line , --lv-accent-deep , --lv-accent-light ; global typography, heading, button and input rules driven by Theme settings; pre-hydration layout constraints so product cards do not \"explode\" before JS runs. Global snippets: custom-button-animations , loading-states , policy-page-css , cookie-banner-css , button-fill-slide (when enabled), sale-badge-css , card-mini-add-assets . An inline script that defines the global theme object (routes, sizes, strings, settings such as currency_code_enable , currencyCode , moneyFormat ) and loads PhotoSwipe, smooth-scroll and swatch data from assets . {{ content_for_header }} , then vendor.js , theme.js , banner.js (deferred). Body: header group, <main> , footer group, search-predictive (popdown style), cart-drawer , quick-view-modal . layout/password.liquid is a lighter frame for the password page (typography, buttons, its own styles and scripts). 3. The design-token pipeline Theme settings (config/settings_data.json) ├─ Theme Palette preset ─────► palette hexes ─► --lv-* variables ─┐ ├─ Colors (5 schemes) ───────► .color-scheme-N classes ───────────┤ ├─ Typography ───────────────► theme-typography ─► font variables ┼─► used by every section ├─ Buttons & Controls ───────► --btn-* variables ─────────────────┤ └─ Product Card / Price ... ─► snippet logic and CSS variables ───┘ A section adds class=\"color-{{ section.settings.color_scheme }}\" and then uses var(--bg) , var(--text) , var(--lv-accent-deep) etc., so it follows palette changes automatically. When Theme Palette is on, the palette overrides the stored scheme values. Turn palette_control off to use the hand-edited schemes. Buttons are styled in two layers: the Pipeline framework ( theme.css ) and the project's custom-button-animations snippet (which uses !important heavily to win). Section-level custom buttons set the --btn-base-* and --btn-regular-hover-* variables locally. 4. JavaScript Piece What it is assets/theme.js Pipeline framework bundle (AOS, Flickity, MicroModal, Rellax, axios, Sqrl, theme currency/addresses helpers) plus the framework's cart, header, product and section logic. It dispatches DOM events such as theme:cart:change , theme:cart:init , theme:cart:reload , theme:drawer:open/close/toggle , theme:cart-item:added/updated assets/vendor.js , photoswipe.js , smoothscroll.js Third-party libraries assets/banner.js Banner video playback, slide rotation, scroll cue assets/product-showcase.js Custom elements <product-showcase-slider> , <showcase-video> , <split-showcase-banner> Inline <script> in snippets and sections Feature code: cart drawer ( syncCartDrawerUI , remove confirmation, clear all, window.addToCartAjax ), quick view, card mini add popup, review form, account dashboard, product page (gallery, variants, engraving), predictive search Cart updates use Shopify's AJAX cart ( /cart/add.js , /cart/change.js , /cart/clear.js , /cart.js ) and the Section Rendering API ( ?section_id=api-cart-subtotal , api-cart-items ). Search suggestions use predictive_search_url and the predictive-search section. Storage: the wishlist uses localStorage keys bss_wishlist and bss_wishlist_products . No cookies are set by the custom code besides Shopify's own. Theme editor events: several sections re-initialize on shopify:section:load so they work while editing. 5. CSS organization and prefixes Prefix Area lv- General custom code (cards, pagination, dropdowns, account, mini-add popup lv-mp ) pv- Product page ( pv-eng-card for engraving) pg Product gallery cf / cf-card / cf-bubble Home reviews and the shared review cards pr Product page reviews rf Review form pop-up prs Product review summary lv-acct- Account dashboard cart__ Cart drawer and cart page (framework names) fnl Footer newsletter Section CSS is scoped with the section id ( #cf-{{ section.id }} ) or a unique class. Modern CSS is used throughout: color-mix() , :has() , container queries (review cards, product page), CSS grid, <dialog> , 100dvh . The theme targets current evergreen browsers (recent Chrome, Edge, Safari 16+, Firefox). Review cards respond to their own width with container queries, so they stay correct in narrow grid columns on tablets. 6. Settings and translations config/settings_schema.json defines the 19 groups; config/settings_data.json stores the current values (and the five color schemes). Section settings are saved in templates/*.json and sections/*-group.json . locales/en.default.json (default) and locales/nl.json . Keys are grouped: accessibility , blogs , breadcrumbs , cart , collections , customer , general , pages , products , sections . There are 763 English texts; Dutch covers all but the seven newest review texts. Use {{ 'group.key' | t }} ; variables use {{ var }} placeholders and are passed as named arguments. There are no *.schema.json locale files: schema labels are written in English directly. 7. Third-party and base code Pipeline theme by Groupthought Themes (base framework, see the license note at the top of assets/theme.js ). Modified versions are not supported by Shopify or Groupthought. PhotoSwipe (lightbox), Flickity (sliders), AOS (scroll animations), Rellax , MicroModal , axios , Sqrl (templating), smoothscroll-polyfill . Fonts from Google Fonts / Shopify fonts, chosen in Theme settings. 8. Where to look when ... You want to change... Look in A color or font for the whole store Theme settings; layout/theme.liquid (variables), snippets/css-variables.liquid , snippets/theme-typography.liquid How buttons look snippets/custom-button-animations.liquid , snippets/button-fill-slide.liquid The product card snippets/product-grid-item.liquid , assets/product-grid.css , snippets/card-mini-add-assets.liquid The cart drawer snippets/cart-drawer.liquid , snippets/cart-line-items.liquid The product page sections/main-product.liquid and the product-* snippets Engraving snippets/engraving-info.liquid and friends (see Custom features ) Reviews sections/customer-feedback.liquid , sections/product-reviews.liquid , snippets/feedback-*.liquid , snippets/review-form.liquid The header and menus sections/header.liquid , snippets/header-*.liquid , snippets/nav-item*.liquid Translations locales/*.json The backend reviews-api/ and Reviews_API/ ","ref-theme-settings":" Theme settings reference Everything in this file is edited in Online Store > Themes > Customize > Theme settings (the gear/paintbrush icon in the theme editor). These settings apply to the whole store . They control colors, fonts, buttons, product cards, prices, reviews, engraving and the cart. Section-specific settings (one banner, one product grid ...) are in the section reference instead. Groups at a glance Group What it controls Logo & Favicon (Global) Store logo, favicon and Shopify brand logo usage. Theme Palette One-click color palettes (Champagne Gold, Rose Gold, Platinum, Emerald, Midnight or Custom) that drive all color schemes. Colors The five color schemes used by sections. Typography Heading, body, navigation and accent fonts, sizes, weights and letter spacing. Layout Page width and general spacing. Breadcrumbs Style and visibility of breadcrumb trails. Loading & skeleton Image placeholders and the animated brand loader. Animations Scroll and hover animations, smooth scrolling. Buttons & Controls Shape, size, colors and hover animation of every button. Inputs & Form Controls Look of form fields. Product Card The product card used in every grid: hover effect, quick add, quick view, wishlist, arrows. Reviews Review card design, review form design and product image in review cards. Engraving Custom engraving field: label, limits, pricing tiers, card button. Product Page & Media Product page media options. Price & Badges Sale badge style, price display, discount labels. Cart & Drawer Cart drawer and checkout button styling. Social media Social profile links. Custom CSS A box for extra CSS (advanced). Theme: Jewelry Shop · Version: 2.0.0 · Author: BSS Software Solutions Logo & Favicon (Global) Universal Store Logo This logo applies across your Desktop Header, Mobile Header, Drawer Menu, Footer, and Password Page. Note: Shopify Checkout & Hosted Customer Login pages pull their logo from Shopify Admin > Settings > Brand. To sync everything seamlessly with 1 click, enable 'Use Shopify Brand Logo' below or upload the logo in Admin > Settings > Brand. Setting Type What it does Default Use Shopify Brand Logo (from Admin > Set   try { var saved = localStorage.getItem('aurelle-docs-theme'); if (saved) root.setAttribute('data-theme', saved); } catch (e) {}
  document.getElementById('themeBtn').addEventListener('click', function () {
    var dark = root.getAttribute('data-theme') === 'dark' || (!root.getAttribute('data-theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
    var next = dark ? 'light' : 'dark'; root.setAttribute('data-theme', next);
    try { localStorage.setItem('aurelle-docs-theme', next); } catch (e) {}
  });
  document.getElementById('menuBtn').addEventListener('click', function () {
    var open = document.body.classList.toggle('nav-open'); this.setAttribute('aria-expanded', String(open));
  });

  buildNav();
  window.addEventListener('hashchange', function () { if (!q.value) show(route()); });
  show(route());
})();
</script>

</body>
