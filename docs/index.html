<li>Review cards respond to <strong>their own width</strong> with container queries, so they stay correct in narrow grid columns on tablets.</li>
</ul>
<h2 id="6-settings-and-translations">6. Settings and translations</h2>
<ul>
<li><code>config/settings_schema.json</code> defines the 19 groups; <code>config/settings_data.json</code> stores the current values (and the five color schemes). Section settings are saved in <code>templates/*.json</code> and <code>sections/*-group.json</code>.</li>

<h2 id="colors">Colors</h2>

  var SEARCH = {"project-overview":" 1. Project overview 1.1 What this project is This project is the complete online store for Aurelle Fine Jewelry , a premium jewelry brand selling handcrafted, waterproof and hypoallergenic jewelry with custom engraving. It runs on Shopify and was built by BSS Software Solutions . It is made of four parts: Part What it is Where it lives 1. The Shopify theme (\"Jewelry Shop\" v2.0.0) Everything customers see: home page, collections, product pages, cart, account area, blog, search This repository: layout/ , sections/ , snippets/ , templates/ , assets/ , config/ , locales/ 2. Custom backend services Small serverless applications that do things Shopify cannot do alone: save reviews safely, send the welcome email, send email campaigns, handle unsubscribes reviews-api/ in this repository, deployed to Vercel at https://your-reviews-service.vercel.app 3. Email templates 17 branded versions of Shopify's order, shipping, account and marketing emails Email_Templates/email-notification-templates.md (copied into Shopify Admin) 4. Catalog and data tools Scripts and data tools to create collections and menus, import products and photos, and generate lifestyle product images _project_resources/ (scripts, CSV/JSON catalogs, image archives) The theme is built on the Pipeline theme framework by Groupthought Themes and has been heavily customized. All Aurelle-specific design, features and sections were added on top of it by BSS Software Solutions. 1.2 Store facts Item Value Brand name on the storefront Aurelle (Fine Jewelry) Custom storefront domain https://shopify-jewelry.bssoln.com Shopify store domain your-store.myshopify.com Languages English (default) and Dutch ( nl ) Main currency Euro (€). Bangladeshi Taka is also supported where the store sells in BDT Free shipping From €39 (shown in the cart drawer progress message and in the announcement bar) Returns 14 days (shown in the trust strip) Support / contact email used in templates info@bssoln.com Theme author BSS Software Solutions · https://bssoln.com Name note. Some technical names (the store address, the Vercel service address, two sibling folders and the lv- CSS prefix, for example --lv-accent ) come from the project's earlier working name. They are internal identifiers, not customer-facing text. The customer-facing brand is Aurelle . The lv- prefix simply marks custom code. 1.3 What customers can do (features at a glance) Browse a luxury-styled store with a transparent/sticky header and rich mega menus. Filter, sort and switch between grid and list on collection pages. Use the quick add and wishlist (heart) buttons on product cards. A quick view pop-up is built in and can be switched on in Theme settings > Product Card (it is currently off). Add custom engraving to a product with live character counting and tiered pricing. See color swatches, variant pills, size guide links and a low-stock message on products. Open a slide-out cart with a free-shipping progress message. Read and write reviews with star ratings and photos (signed-in customers only). Search with live suggestions. Sign in to a branded account dashboard (orders, addresses, saved items). Subscribe to the newsletter and receive a welcome email with a discount code . Switch language, and see prices with the currency code. Book or learn about the on-site Permanent Jewelry service. 1.4 What the store team can do (admin features) Rearrange and edit every page in the theme editor without code. Change the whole color look with one palette dropdown. Approve or hide customer reviews in Shopify Admin. Send email campaigns to newsletter subscribers from a custom tool. Import products, images and collections in bulk with the catalog tools. 1.5 How the pieces connect Customer browser │ ├── loads pages from Shopify (the theme: Liquid + CSS + JavaScript) │ │ │ ├── reads reviews, products, menus from Shopify │ └── uses Shopify's own cart, search and checkout │ ├── submits a REVIEW ──────────► review service (Vercel) ──► creates a draft \"review\" in Shopify │ └── subscribes to the NEWSLETTER ► Shopify customer form (stores the subscriber) └► welcome-email service (Vercel) ──► emails a discount code Store team ├── approves reviews in Shopify Admin (Content > Metaobjects > Review) ├── sends campaigns from the campaign tool (served by the Vercel service) └── imports products with the catalog importer / scripts 1.6 Technology (for developers) Layer Technology Storefront Shopify Online Store 2.0 : Liquid, JSON templates, sections with blocks, theme settings, section groups Styling CSS custom properties (design tokens), per-section <style> blocks, one large framework stylesheet JavaScript Vanilla JS and native web components (no build step for the custom parts); Pipeline framework bundle for the core Data Shopify products/collections, metaobjects (type review ), customer accounts, localStorage for the wishlist Backend Vercel serverless functions (Node.js 18+), Shopify Admin GraphQL API , Nodemailer with Gmail SMTP Tooling Shopify CLI ( v5.0.2 : theme dev , theme push ), Node and Python automation scripts 1.7 Design system The store looks consistent because every section reads the same design tokens (CSS variables) generated from Theme settings. Brand palette When Theme Palette is turned on (it is), one dropdown chooses a complete palette. The current palette is Champagne Gold . Palette Ivory (page) Cream (soft areas) Sand (deeper areas) Ink (text) Accent (metal) Dark Hairline Champagne Gold (current) #ffffff #f7f5f0 #f0e9dd #1a1a1a #9b7c53 #1c1a17 #e6e2d8 Rose Gold #fffafa #fbeeec #f4dcd6 #2b1a1e #b76e79 #3a1f27 #eacfca Platinum #fbfcfd #eff2f5 #dfe4ea #0f1319 #5d6b7c #12171f #d5dbe2 Emerald & Gold #fafdfb #eaf2ec #d9e7dd #0e1f17 #b08d4a #0a2d21 #cfe0d5 Midnight #fafbff #edf0fa #dce2f4 #0e1430 #b08d57 #0e1430 #d3d9ec Custom any any any any any any any These become the CSS variables --lv-ivory , --lv-cream , --lv-sand , --lv-ink , --lv-accent , --lv-accent-deep , --lv-accent-light , --lv-dark and --lv-line , available in every section. The five color schemes Every section has a Color scheme dropdown. The five schemes are: Scheme Background Text Button Typical use scheme-1 #ffffff white #1a1a1a #1a1a1a black, white label Default page background scheme-2 #f7f5f0 cream #1a1a1a #1a1a1a Announcement bar, footer, soft sections scheme-3 #f0e9dd sand #1a1a1a #1a1a1a Deeper accent sections scheme-4 #e7ded3 warm taupe #1a1a1a #806745 gold, white label Highlight sections scheme-5 #1c1a17 near black #ffffff #b59a76 light gold Dark sections Typography Role Current font Headings (H1 to H6, section titles) Playfair Display (elegant serif) Body text, subheadings, buttons, navigation Quicksand (clean rounded sans-serif) Navigation links 13 px, weight 600, uppercase All fonts, sizes, weights and letter spacing can be changed in Theme settings > Typography. Presets and a \"custom\" mode are available. Shape and feel Sharp corners by default (button, card, image and badge radius are all 0). Every radius can be raised in Theme settings. Buttons are uppercase, 12 px, weight 600 with a thin border. The default look is the gold button style. Page width is up to 1600 px . Scroll reveal animations and smooth scrolling are on. 1.8 Folder map Le_Velair_Shopify/ (Theme repository root) ├── assets/ CSS, JavaScript, icons, swatches.json → reference/assets.md ├── config/ │ ├── settings_schema.json Theme settings definitions (19 groups) │ └── settings_data.json Current theme settings data ├── layout/ │ ├── theme.liquid Main HTML frame for every storefront page │ └── password.liquid Password landing page frame ├── locales/ │ ├── en.default.json English translations │ └── nl.json Dutch translations ├── sections/ 32 modular sections + 2 section groups → 05-sections-guide.md ├── snippets/ 66 reusable Liquid UI components → reference/snippets.md ├── templates/ 16 JSON page templates + customer liquid templates ├── reviews-api/ Serverless reviews API & welcome email (Vercel) → 08-backend-services.md ├── docs/ Interactive single-page documentation & reference ├── _project_resources/ (Git-ignored) Catalog CSVs, heavy image archives, backup zips, scripts └── README.md Project overview and developer guidelines Resource storage ( _project_resources/ ) All heavy, non-theme assets are preserved locally in _project_resources/ (ignored by git to keep the theme lightweight): Folder What it holds _project_resources/catalog_and_data/ Product CSV import files, products_full.json , image mapping tables _project_resources/archives/ Original photo zip archives ( Aurelle_Main_Product_Images.zip ) _project_resources/backups/ Theme zip backups ( Aurelle Luxury Theme-1.0.0.zip ) _project_resources/scripts/ 14 automation scripts for catalog import, menu creation, and AI photo processing _project_resources/images/ Raw product images and lifestyle shot queues 1.9 Counts Item Count Sections 32 (+ header and footer groups) Snippets 66 JSON page templates 16 Liquid templates (account, gift card) 8 Layouts 2 Theme setting groups 19 Languages 2 (English, Dutch) Assets (JS, CSS, images, data) 36 Backend endpoints 4 (review, welcome email, campaign, unsubscribe) plus one shared email layout file Notification email templates 17 Automation scripts 14 ","store-owner-guide":" 2. Store owner guide Step-by-step recipes for the work you do every day. Everything here is done in Shopify Admin or in the theme editor . No coding is needed. Menu names. Shopify sometimes renames items in its Admin. If a menu below looks slightly different, use the search box at the top of Shopify Admin. Quick map: where do I change what? I want to change... Go to A banner, a section, the order of the home page Online Store > Themes > Customize > Home page The top announcement message Customize > header group > Announcement bar The menu links (header and footer) Content > Menus Menu pictures and dropdown design Customize > header group > Header > blocks Colors, fonts, buttons, product cards Customize > Theme settings (see Design and settings guide ) A product, price, photos, variants Products Collections Products > Collections Reviews Content > Metaobjects > Review Page texts (About, FAQ ...) Online Store > Pages , then Customize for the layout Fixed texts such as \"Add to cart\" Customize > bottom-left Edit default theme content , or Settings > Languages Customer emails (orders, shipping ...) Settings > Notifications (see Email templates ) Discounts Discounts Email campaigns The campaign tool (see Backend services ) 2.1 The theme editor: basics In Shopify Admin open Online Store > Themes . Click Customize on the live theme. At the top, use the page selector (it says \"Home page\") to open any page type: Home page, Products, Collections, Cart, Blog, Pages ... The left sidebar lists the sections of that page. Click one to edit its settings; the page on the right updates live. Click Save (top right) to make your changes live. Safe editing tips To experiment without risk, click the three dots next to the theme > Duplicate , edit the copy, and Publish it when you are happy. Keep the old one as a backup. The eye icon next to a section hides it without deleting it. Add section adds a new block to the page; Add block adds an item inside a section (a slide, a tile, a message). Use the desktop / mobile icons at the top to check both layouts. Many settings have separate desktop and mobile values. 2.2 Home page The home page is built from sections (see the list in Pages and templates ). Change the main banner (hero) Customize > Home page > Homepage banner . Click the Slide block. Choose Media type (image or video), then upload the desktop and mobile media. Fill the small heading, big heading, button label and link. Choose the text position and, if the picture is busy, adjust the dark overlay . To add more slides, click Add block > Slide . Turn on Auto-rotate slides in the section settings if you want them to change by themselves. Tip: upload a different, taller picture for mobile so the product is not cut off. Change the category tiles (mosaic) Customize > Home page > Mosaic & Grid Banner . Click a Tile block, upload a picture or video, set the title and link. Add or remove tiles. The grid re-arranges itself depending on how many tiles you have. Feature a collection next to a picture Use Collection split : choose the collection , the banner image or video, the heading and the button. See Collection split . Show a sale banner Use the Sale section: upload the image, write the heading and description, set the button link. If a person's face is cut off in the picture, change Desktop image focal position to a Top option. See Sale . Reorder, hide or delete sections Drag a section in the left list, click the eye to hide it, or click the three dots > Remove . 2.3 Announcement bar (top strip) Customize > scroll to the top > Announcement bar . Click a Announcement block. Type the text and an optional link. Add more blocks for more messages. They rotate automatically (change the speed with Slide speed ). For a designed message (animated gold text, a code you can click to copy), paste the HTML into Custom HTML . Leave it empty for a normal text message. 2.4 Menus and mega menus Edit the links Content > Menus . Open Main menu (header) or Footer menu and add, rename or reorder links. Nested links become dropdown items. Add pictures to dropdown menus Customize > Header section > Add block . Navigation Item Image adds a picture card to a menu item. Custom Mega Menu builds a fully designed dropdown (columns, cards, a promo image) for one menu item. In each block, type the exact title of the menu item (as written in Content > Menus ) so the design is attached to the right link. Rename it in both places if you rename the menu item. Change how all dropdowns look Header section > Global Dropdown Styling : background, text and hover colors, radius, shadow, font size. 2.5 Products Add a product Products > Add product . Add a title, description and photos. The first photo is the main image; the second photo shows on hover in product grids. Set the price. For a sale, set the Compare-at price higher than the price; the sale badge (for example \"-20%\") appears automatically. Add options (for example Size, Metal, Stone) and variants. Assign the product to a collection (or use tags so automated collections pick it up). Make a product engravable The engraving box appears when any of these is true (Theme settings > Engraving > Engraving field: Auto ): the product title, type or a tag contains one of the engravable keywords (default: engrav , graver , personali ), or the product has an option whose name contains \"engrav\" or \"char\" (for example an option called Engraving characters ). Charging by number of characters: add an option named like Engraving characters with values such as 3 characters , 5 characters , 7 characters , 10 characters , 12 characters and give each variant its own price. The product page shows the extra price on each pill (\"+€X\") and limits the engraving text to the chosen number. The text the customer types is saved on the order as a line item property named Engraving (the name can be changed in Theme settings > Engraving). Size guide link On the product section, choose the Size guide page (a page that uses the page.size-guide template). Rings, bracelets and necklaces then link to the right tab of the guide. Category details (color, material) The product page has a hook for Shopify's standard category metafields (Color, Jewelry material ...). It is not finished and shows nothing yet (see Maintenance ). 2.6 Collections Products > Collections > Create collection (manual, or automated with rules). Add a collection image . The collection banner and the mega menu can use it. The look of every collection page is set once: Customize > Collections > Collection Grid (columns, filters, sorting, products per page). To add a hero banner to one kind of collection page, add the Collection banner section in the Collections template. Filters (color, metal, price ...) are managed in the Shopify Search & Discovery app, not in the theme. 2.7 Pages (About, Contact, FAQ, Permanent Jewelry, Size guide, policies) Online Store > Pages > Add page , write the content (if the design has a text area). On the right, under Theme template , choose the design: Page Template Any normal text page page About us page.about Contact page.contact FAQ page.faq Permanent Jewelry page.permanent Size guide page.size-guide Account dashboard page.account-dashboard Open Customize > choose that page > edit Page Content (or Size guide ) for the images, headings and buttons of the design. Add the page to a menu in Content > Menus . FAQ questions: in the FAQ page add a Question block for each question and fill the category, question and answer. Customers can search and filter by category. Policies (Refund, Shipping, Privacy, Terms): write them in Settings > Policies . The theme styles those pages automatically. 2.8 Reviews Customers can write a review on any product page. Reviews are saved as drafts and appear on the store only after you approve them. Approve a review Content > Metaobjects > Review . Open a review. Read it. If it is fine, set its status to Active (published) and save. To hide it, set it to Draft . Active reviews appear on the product page and (if the reviews section is on the home page) on the home page. Add a review yourself In the same Review list click Add entry and fill name, rating (1 to 5), text, product, date, and tick approved and verified . Show hand-written testimonials In the home page Customer feedback section set Source > Blocks below only and add Review blocks. Change how reviews look Customize > Theme settings > Reviews > Review card layout (luxury minimal, customer photo cards, editorial magazine, modern grid, masonry, swipe carousel, parallax wall or speech bubble slider). Customers must be signed in to write a review. For details and troubleshooting see Reviews system . 2.9 Newsletter, welcome email and discounts Newsletter box : the footer Newsletter settings. The text, button and the \"10% off\" badge are editable. When a visitor subscribes, Shopify saves them as a customer with email marketing consent and the tag newsletter , and a welcome email with a discount code is sent automatically. Important: the code shown in the email and badge is just text. You must create the same code in Discounts > Create discount (for example WELCOME10 , 10% off) or customers will find that the code does not work. The code used in the email is set in the backend service (see Backend services ). The password (coming soon) page has the same signup box. Send an email campaign Use the campaign tool (see Backend services ): write a subject, heading, text, optional discount code and button, send yourself a test email first, then send to all subscribers. 2.10 Orders, shipping and customer emails Shopify sends emails for orders, shipping, refunds, account invitations and more. This project ships 17 branded templates to make all of them match the store. To install or update one: Settings > Notifications , open the email, paste the subject and code (full instructions in Email templates ). Engraving text appears on the order and in emails as a property under the product name. 2.11 Languages and texts Settings > Languages adds languages. The theme includes English and Dutch. Fixed theme texts (button labels, messages): Customize > bottom-left Edit default theme content . Product, collection and page translations: the Translate & Adapt app. The language switcher in the header is switched on in the Header section ( Show language switcher ). 2.12 Logo, favicon, colors and fonts Logo / favicon: Theme settings > Logo & Favicon (Global) . Whole color look: Theme settings > Theme Palette (Champagne Gold, Rose Gold, Platinum, Emerald, Midnight or Custom). Fonts: Theme settings > Typography . Buttons: Theme settings > Buttons & Controls . All details: Design and settings guide . 2.13 Customer accounts Customers sign in with the branded Login page. After signing in they see the classic account pages, or the dashboard if you linked a page that uses the page.account-dashboard template. The dashboard has Overview, Orders, Addresses and Saved (wishlist) . The wishlist lives in the customer's own browser. Account settings (new or classic accounts) are in Settings > Customer accounts . 2.14 Password page (coming soon / maintenance) To lock the store, Online Store > Preferences > Restrict access with a password . Visitors then see the branded password page, which can collect newsletter signups. Edit it in Customize > Password page . 2.15 Gift cards Gift cards are created in Products > Gift cards . The page a customer opens (balance, code, QR code and \"add to wallet\") is part of the theme ( templates/gift_card.liquid ). 2.16 Cookie banner The cookie / privacy banner is Shopify's built-in Customer Privacy banner, styled by the theme to look luxurious. You configure it in Settings > Customer privacy . 2.17 Before you publish changes: checklist Preview on desktop and mobile (editor icons). Click every new button or link. Check the product page of an engravable product (type text, change variant). Add a product to the cart and open the cart drawer. If you changed menus, open the dropdowns. Click Save . If something looks wrong after publishing, open Online Store > Themes , click the three dots next to the previous theme copy and Publish it to go back. 2.18 Who to call For anything that needs code (new sections, a broken backend, changes to hard-coded values), contact BSS Software Solutions ( https://bssoln.com ). Developer-level information is in Maintenance and troubleshooting . ","design-and-settings-guide":" 3. Design and settings guide The look of the whole store is controlled from one place: Online Store > Themes > Customize > Theme settings (click the gear / paintbrush icon at the bottom of the left bar). A change there updates every page at once. This guide explains each group in plain language. For every single option and default value see the Theme settings reference . For settings that belong to one section only (one banner, one grid) see the Sections guide . Rule of thumb: Theme settings change the look of the whole store . Section settings change one block of one page . If a section setting is left on its default, the theme setting is used. 3.1 Logo and favicon (Logo & Favicon) What How Which logo is used Turn on Use Shopify Brand Logo to use the logo from Settings > Brand . Or upload a Custom Theme Logo here. The same logo is used in the header, mobile header, footer and password page. Logo size Separate widths for desktop, mobile and footer. Mobile alignment Centered or left (next to the menu button). Favicon The tiny icon in the browser tab (32 x 32 px). Checkout and the customer login page take their logo from Settings > Brand in Shopify Admin, not from the theme. 3.2 One-click colors (Theme Palette) Pick one palette and the whole store follows: backgrounds, text, buttons, gold highlights, borders. Palette Mood Champagne Gold (current) Warm ivory with gold Rose Gold Blush with rose gold Platinum Cool silver and steel Emerald & Gold Deep green with gold Midnight Navy with soft gold Custom You choose seven colors: Ivory, Cream, Sand, Ink, Metal accent, Dark, Hairline Palette controls the color schemes (on): the palette automatically fills the five color schemes. Turn it off to edit each scheme by hand in the Colors group. Button colors (applies to every button): Classic (white, turns black on hover), Solid dark, Palette gold (turns dark on hover) or Outline. See the exact hex colors in Project overview > Design system . 3.3 Color schemes (Colors) A color scheme is a named set of colors: background, optional gradient, text, solid button, button label, secondary button label, and border. The store has five (scheme-1 to scheme-5). Every section lets you choose one, so you can alternate white, cream and dark sections down a page. 3.4 Fonts and text (Typography) Control What it does Font style preset Ready-made pairings such as Parisian Haute Joaillerie (Cormorant + Plus Jakarta), Modern Heirloom (Playfair Display + Quicksand, the current look) , Sculptural Roman, Couture Editorial, Minimalist Maison and more, or Custom to pick every font yourself Heading font Titles and section headings (currently Playfair Display) Subheading, eyebrow and accent font Small labels above headings, accents (currently Quicksand) Body font Paragraphs and product text (currently Quicksand) Navigation font and Button font Menu and button text (match the body by default) Weights, capitalization, letter spacing Per role, with an \"auto\" mode that chooses what suits the font Size scale Percentage to make all headings, subheadings or body text larger or smaller Navigation links Size, weight and uppercase for the header menu 3.5 Page layout (Layout) Maximum page width (currently 1600 px) Vertical spacing between sections and the horizontal / vertical grid spacing between product cards. 3.6 Breadcrumbs The \"Home / Collection / Product\" trail. Turn on or off for all pages, choose the separator (slash, arrow, dot, dash), text size, capitalization and spacing. 3.7 Loading and skeleton Skeleton: a soft shimmer or pulse shown on product cards while pictures load. Product page loader: an animated brand loader (a stream of delicate jewelry icons) shown while the product gallery loads. You can change its size and three colors. 3.8 Animations Hover transitions and button animations (and their speed). Sliding fill animation on button hover (currently off). Reveal animations as you scroll (on). Smooth page links and smooth scrolling (on) and its strength. 3.9 Buttons and controls Controls every button in the store: universal style (solid fill / outline / soft / minimal text), corner radius (0 = sharp), background, text and border colors, hover colors, border thickness, uppercase text, text size, weight and letter spacing, and the round buttons (icons in circles) colors. The brand accent (gold) is also set here. Individual sections can override these (for example a banner button set to \"Theme button\" follows these settings, while a \"Solid white\" button stays white). 3.10 Inputs and forms Corner radius and border thickness of every text field and dropdown. 3.11 Product card The card used in every product grid. Key controls: Control Effect Hover animation Soft zoom + lift, soft zoom (image only), lift + shadow (whole card) or none Show 2nd image on hover Swaps to the second product photo Text alignment , Show vendor Left/center text; show the brand name Quick Add to Cart (desktop) and Add button on mobile The \"+\" or add button on cards. The variant popup can slide up from the bottom, slide in from the side, appear as a small popup above the button, or cover the product image. Its side and size can be set Quick View Pop-up product view from the card (currently off) Wishlist Heart button on cards (on) Image arrows Left/right arrows on cards that have several photos; size, colors, hover effect, whether always visible, and a separate mobile setting Card border radius Rounded or sharp card corners 3.12 Product page and media Corner radius of the product gallery images, the thumbnails, and of all other media (cart thumbnails, modals). 3.13 Price and badges Control Effect Show currency codes Prices show \"€22,28 EUR\" (on) Current price design and size Style of the price on cards: clean classic, editorial serif, modern bold or fine gold underline Enable Sale badge (and on mobile) Shows the discount badge on discounted products Badge text Percentage off (\"-20%\") or the word SALE Badge design Classic ribbon, fine jewelry tag, heritage seal, minimal capsule (current) or minimal square, with its colors Badge shape / corner radius Square or rounded 3.14 Reviews Control Effect Review card layout One layout for the whole site (home and product pages): luxury minimal, customer photo cards, editorial magazine, modern grid, masonry, swipe carousel, parallax review wall or speech bubble slider (current) Show product image in review cards Adds the product thumbnail to each review Review submission form How the \"Write a review\" window looks: elegant popup (modal), split screen (image + form) or step by step Review form image Image for the split screen design Review signing secret A private code that lets the theme prove to the review service who is signed in (see Reviews system ). Never share it Reviews API URL Address of the review service (leave the default unless the service moves) 3.15 Engraving Controls the custom engraving field on products and on product cards: when it appears (auto / every product / never), the keywords that mark a product as engravable, the field label and placeholder, the maximum characters, whether the text is required, the name of the order property, and what the product-card button says (\"Personalise\") and does (open a pop-up or go to the product page). See Custom features > Engraving . 3.16 Cart and drawer Controls the slide-out cart: where the checkout button sits (fixed at the bottom or right after the items) and its style, colors, hover colors, height and text size. 3.17 Social media Instagram and TikTok profile links (used in the footer social column). 3.18 Custom CSS A box for extra styling rules that apply to the whole store. For developers only: a mistake here can break the layout. Keep a copy of what you put in. 3.19 Common design tasks I want to... Do this Make the whole store rose gold Theme Palette > Palette > Rose Gold Make buttons gold Theme Palette > Button colors > Palette gold Use rounded buttons Buttons & Controls > Button corner radius > raise it Make headings bigger Typography > Heading size scale Remove the heart on product cards Product Card > Enable Wishlist button > off Show a quick view pop-up Product Card > Enable Quick View modal > on Change how reviews look Reviews > Review card layout Change the sale badge Price & Badges > Badge design / colors Stop showing \"EUR\" after prices Price & Badges > Show currency codes > off Remove scroll animations Animations > Enable reveal animations on scroll > off ","pages-and-templates":" Pages and templates A template decides which sections a type of page contains. The theme has one template per kind of page. Shopify uses them automatically (collections use the collection template, products use the product template). For pages you create yourself, you choose the template in Online Store > Pages > (page) > Theme template . Where the content lives Template : which sections the page has, and in which order. Edited in the theme editor. Header and footer groups : shown on all pages. Page content : text and images you type into the page, product or article in Shopify Admin. Templates and their sections Template Used for Sections in order 404.json Page not found : Shown when a link is broken. 404 Page article.json Blog article : A single blog post. Blog Article blog.json Blog listing : The list of articles in a blog. Blog Posts cart.json Cart page : The /cart page. Cart Page collection.json Collection page : Used by every collection. Combines the collection grid, a sale banner and a trust strip. Collection Grid → Sale → Trust icons index.json Home page : The home page. Sections are added, reordered and edited in the theme editor (Customize > Home page). Homepage banner → Featured collection → Rich text → Mosaic & Grid Banner → Rich text → Collection split → Parallax showcase → Rich text → Collection split → Customer feedback → Trust icons → Sale page.about.json About page : Assign to the \"About us\" page for the designed About landing layout. Page Content → Featured collection page.account-dashboard.json Account dashboard page : Assign to a page that should act as the customer account dashboard (Overview, Orders, Addresses, Saved). Customer Dashboard page.contact.json Contact page : Assign to the Contact page for the designed contact layout with a form. Page Content → Featured collection page.faq.json FAQ page : Assign to the FAQ page: categories, search and accordion of questions. Page Content → Featured collection page.json Default page : The standard design for any content page (policies, terms ...), followed by a featured collection. Page Content → Featured collection page.permanent.json Permanent Jewelry page : Assign to the Permanent Jewelry page: the on-site service landing layout with an atelier showcase. Page Content → Featured collection page.size-guide.json Size guide page : Assign to the Size guide page: tabs with size charts and a ring size calculator. Size guide → Featured collection password.json Password page : Shown when the store is password protected. Password Page product.json Product page : Used by every product: product details, trust strip, reviews and \"You may also like\". Product page → Trust icons → Product reviews → Featured collection search.json Search results : The page that opens when a customer submits a search. Search Results The home page in detail Sections appear top to bottom in this order: Homepage banner (1 block) Featured collection Rich text Mosaic & Grid Banner (4 blocks) Rich text Collection split Parallax showcase Rich text Collection split Customer feedback (3 blocks) Trust icons (4 blocks) Sale You can reorder, hide, delete or add sections freely in the theme editor. Header and footer groups Header group ( sections/header-group.json ): announcement → header Footer group ( sections/footer-group.json ): footer → subfooter Customer account and other Liquid templates These are classic Shopify templates written in Liquid (not editable as sections), styled to match the theme: File What it is templates/gift_card.liquid The page a customer opens to see and use their gift card (balance, code, QR code and add-to-wallet buttons). templates/customers/account.liquid Classic Shopify customer account page (orders overview). templates/customers/activate_account.liquid Where a customer sets a password when activating a new account. templates/customers/addresses.liquid Address book page. templates/customers/login.liquid Sign-in page. It simply renders the \"Login\" section. templates/customers/order.liquid Details of one order. templates/customers/register.liquid Create account page. templates/customers/reset_password.liquid Reset password page. Layouts File What it is layout/theme.liquid The frame around every page: <head> (fonts, colors, styles, SEO tags), the header group, the page content, the footer group, the search popdown, the cart drawer and the quick view pop-up. layout/password.liquid The frame used by the password (coming soon) page. Which template for which page? You want to create... In Shopify Admin > Pages, choose theme template... A normal text page (terms, privacy ...) page About us page.about Contact page.contact FAQ page.faq Permanent Jewelry service page page.permanent Size guide page.size-guide Customer account dashboard page.account-dashboard ","sections-guide":" Sections guide A section is a big building block of a page: a banner, a product grid, a header, a footer. In the theme editor you add, remove, reorder and edit sections without touching code. This theme has 32 sections (plus the header and footer groups). Each one has its own page in this documentation with every setting explained. How to work with sections Add: Customize > open a page > Add section > choose a section. Reorder: drag the section by its handle in the left sidebar. Hide without deleting: click the eye icon next to the section. Edit: click the section, change settings on the left, and Save . Some sections are fixed to a page (for example the product page, the cart or the header). You can edit them but not add a second copy. Header & footer Section What it is Where it is used Announcement bar The thin bar at the very top of every page. Header group (every page) Footer The main footer: logo, link columns, text columns, social links and an optional newsletter signup with a welcome discount badge. Footer group (every page) Header The site header: logo, main navigation, search, account icon, cart icon and an optional language switcher. Header group (every page) Subfooter The thin bottom strip: logo, copyright text, legal links and payment method icons. Footer group (every page) Cart (internal) Section What it is Where it is used Cart Items A tiny helper section with no settings. Not placed on a page. Used by the cart scripts. Cart Subtotal A tiny helper section with no settings that returns the cart subtotal markup so the total can be refreshed instantly after quantity changes.. Not placed on a page. Used by the cart scripts. Collection pages Section What it is Where it is used Collection banner A wide banner (3:1 image or video, with separate desktop and mobile versions) that sits above the product grid of a collection. Available on collection pages (not placed by default) Collection Grid The collection page: a header band, filters, sorting, grid / list switch, a \"products per page\" dropdown and the product grid with pagination. Collection page ( collection.json ) Home page Section What it is Where it is used Collection split The signature \"split\" layout of the store: a large sticky banner or media block on one side and a grid of products from a chosen collection on the other. Home page ( index.json ) Customer feedback The \"What our customers say\" reviews section. Home page ( index.json ) Parallax showcase A heading with a video or image in the middle and the store's normal product cards in two columns at the sides. Home page ( index.json ) Mosaic & Grid Banner A grid of image or video tiles of different sizes (a \"mosaic\") with an optional section heading. Home page ( index.json ) Rich text A simple centered block with a heading and a paragraph of formatted text. Home page ( index.json ) Homepage banner The homepage banner (hero). Home page ( index.json ) Home page extras Section What it is Where it is used Instagram Feed A grid of photos that look like an Instagram feed. Available (not placed by default) Product showcase A product showcase with two modes. Available (not placed by default) Utility pages Section What it is Where it is used 404 Page The \"page not found\" screen with a message and a button back to the shop.. Page not found ( 404.json ) Password Page The page visitors see when the store is password protected: badge, heading, subheading, optional newsletter signup and trust badges. Password page ( password.json ) Customer account Section What it is Where it is used Customer Dashboard A modern customer account dashboard with a side navigation: Overview, Orders, Addresses and Saved (wishlist). Account dashboard page ( page.account-dashboard.json ) Login The sign-in and password-recovery page. Customer login template Blog Section What it is Where it is used Blog Article A single blog post page with an editorial hero, optional sidebar with a featured collection, publish date, author, estimated reading time, topic tags, share button and related stories.. Blog article ( article.json ) Blog Posts The blog listing: a branded header, optional featured latest article, topic filter tags and a grid of article cards with pagination.. Blog listing ( blog.json ) Cart & checkout Section What it is Where it is used Cart Page The full cart page: line items, quantity controls, order note, subtotal, checkout button and a trust strip. Cart page ( cart.json ) Pages Section What it is Where it is used Page Content One flexible section behind several page designs: standard content pages, the designed Contact page, service pages with a side menu (shipping, returns, privacy), the FAQ page (categories, search and accordion), the About landing page and the Permanent Jewelry landing page. About page ( page.about.json ), Contact page ( page.contact.json ), FAQ page ( page.faq.json ), Default page ( page.json ), Permanent Jewelry page ( page.permanent.json ) Size guide The size guide page: one tab per jewelry type (rings, bracelets, necklaces ...), each with a size chart table, a \"how to measure\" step list, tips, an optional image and an interactive ring size calculator. Size guide page ( page.size-guide.json ) Product page Section What it is Where it is used Product page The product page. Product page ( product.json ) Product reviews The reviews block at the bottom of the product page: reviews of the current product (from the review metaobject), filter by rating, sort order, \"show more\", and a \"Write a review\" popup. Product page ( product.json ) Search Section What it is Where it is used Search Results The search results page: header with an intro, popular search chips, matching collections and a grid of matching products.. Search results ( search.json ) Predictive Search Returns the live search suggestions (products, collections, pages, articles, and the matched query) while a customer is typing in the search box. Not placed on a page. Used by the search popdown. Home page & collection pages Section What it is Where it is used Sale A promotional banner for sales (for example Black Friday): a wide image with an optional gradient, small label, large heading, description and one or two buttons. Collection page ( collection.json ), Home page ( index.json ) Home page & product page Section What it is Where it is used Featured collection A grid of products from one collection with a heading, subheading and \"View all\" button. Home page ( index.json ), About page ( page.about.json ), Contact page ( page.contact.json ), FAQ page ( page.faq.json ), Default page ( page.json ), Permanent Jewelry page ( page.permanent.json ), Size guide page ( page.size-guide.json ), Product page ( product.json ) Trust icons A trust strip of small icons with a title and a line of text under each (free shipping, 14 day returns, secure payment, handcrafted ...). Collection page ( collection.json ), Home page ( index.json ), Product page ( product.json ) Header and footer groups The header and the footer are section groups : lists of sections shown on every page. Header group: Announcement bar, Header. Footer group: Footer, Subfooter. Edit them from any page in the theme editor. ","custom-features":" 6. Custom features These are the special features that were built for Aurelle on top of the base theme. For each feature you will find: what the customer sees , how you control it , and where the code lives (for developers). # Feature 6.1 Custom engraving 6.2 Product cards (hover, quick add, wishlist, arrows) 6.3 Quick view pop-up 6.4 Wishlist 6.5 Slide-out cart drawer 6.6 Product page extras 6.7 Header, mega menus, language switcher 6.8 Live search 6.9 Collection page tools 6.10 Sale badges and prices 6.11 Banners, split layout and showcases 6.12 Size guide and ring size calculator 6.13 About, Permanent Jewelry, FAQ and Contact pages 6.14 Customer account dashboard 6.15 Newsletter and password page 6.16 Reviews 6.17 Loading states 6.18 Cookie banner and policy pages 6.19 Gift card page 6.20 SEO and social sharing 6.21 Work in progress 6.1 Custom engraving What the customer sees On engravable products a \"Personalise\" card (or a classic grey box) appears on the product page containing the character-count options and a text field with a live counter and a limit. Option pills can show the extra price, for example \"+€X\". On product cards, an engravable product shows a \"Personalise\" hover bar (desktop) or a \"+\" button (phones) instead of size pills. It opens a popup with the engraving field and the options, or goes to the product page. The text is saved on the cart line and the order as a line item property (named Engraving by default) and shows in the cart, the cart drawer and the order emails. How you control it Where What Theme settings > Engraving When the field appears (auto, every product, never), the keywords that mark a product as engravable, the field label and placeholder, maximum characters, required or optional, the order property name, the card button text and what the card button does Product page section > Gallery > Engraving layout and Personalise card color scheme Card look or classic look, and the card colors The product itself Option named like Engraving characters with values 3, 5, 7, 10, 12 and a price per variant. Or a keyword in the title, type or tags How it decides a product is engravable (auto mode) : the product title, type, tags or an option name contains one of the keywords (default engrav , graver , personali ; Dutch keywords work too), or an option name contains \"engrav\" or \"char\". Where the code lives: snippets/engraving-info.liquid (single source of truth), snippets/product-eng-wrap.liquid , snippets/product-engrave-field.liquid , snippets/card-engrave-bar.liquid , snippets/card-mini-add-assets.liquid (card popup), sections/main-product.liquid (product page logic). 6.2 Product cards The product card is one shared piece of code used by every product grid (collections, featured collections, search, related products). What the customer sees: main photo, second photo on hover , product name, price with sale badge, optional vendor, a wishlist heart , a quick add button, optional image arrows to browse the product's photos, and (for engravable items) the Personalise bar. On phones the card shows a compact \"+\" button . Tapping it opens a popup to choose the variant (slides up from the bottom, slides in from the side, appears above the button or over the image) and add to cart. In list view on mobile a normal Add to Cart button can show. How you control it: Theme settings > Product Card (hover effect, second image on hover, alignment, vendor, quick add on desktop and mobile, popup style, wishlist, quick view, arrows and every arrow color and size). Grid columns for each screen size are set per section. Where the code lives: snippets/product-grid-item.liquid , snippets/product-grid-vars.liquid , snippets/card-mini-add.liquid , snippets/card-mini-add-assets.liquid , assets/product-grid.css . 6.3 Quick view A pop-up product view opened from a card: photos, price, variants, engraving and add to cart without leaving the page. It is built in but switched off (Theme settings > Product Card > Enable Quick View modal ). The same pop-up code also keeps the wishlist in sync. Where the code lives: snippets/quick-view-modal.liquid (rendered once by layout/theme.liquid ). 6.4 Wishlist What the customer sees: a heart on cards. Clicking it saves the product. Saved products appear in the Saved tab of the account dashboard. Important: the wishlist is stored in the customer's own browser ( localStorage keys bss_wishlist and bss_wishlist_products ). It is not saved in Shopify, it does not follow the customer to another device, and clearing browser data removes it. How you control it: Theme settings > Product Card > Enable Wishlist button , and the dashboard section setting Show Wishlist tab . 6.5 Slide-out cart drawer What the customer sees: clicking the bag icon opens a drawer from the right with: a free-shipping message with a progress ring (\"Spend €X more for free shipping\" / \"You have unlocked free shipping!\") (free shipping from €39 ); every item with photo, variant, engraving text , price (and \"price x quantity = total\") and a quantity stepper ; a trash button that asks for confirmation before removing an item (also when reducing the last unit with \"-\"); a \"Clear all\" link in the top bar (with confirmation) to empty the cart; the subtotal and the checkout button , with the payment icons and a shipping note; smooth updates without page reload; quantity buttons are locked while updating and numbers stay visible. How you control it: Theme settings > Cart & Drawer (checkout button position, style, colors, height, text size). The free-shipping amount is written in the code (see Maintenance > Values written in code ). Where the code lives: snippets/cart-drawer.liquid , snippets/cart-line-items.liquid , snippets/cart-subtotal.liquid , helper sections api-cart-items and api-cart-subtotal , and the cart scripts inside assets/theme.js . The full cart page is sections/main-cart.liquid . 6.6 Product page Feature Details Gallery Three layouts: thumbnail view (thumbnails on the left, right or below), grid view, or stacked large images. Image ratio (square, 4:5, 3:4, 2:3 or natural), gallery width, click-to-zoom lightbox (PhotoSwipe), image counter and arrows. Desktop scrolling can pin the gallery while the details scroll, pin the details while the gallery scrolls, or scroll normally Variants Pills for sizes and metals, color swatches (color names such as gold, ruby or sea are translated to colors, in English and Dutch) Price Current price, compare-at price, discount percentage badge, currency code Highlights Three short selling points (for example \"Waterproof\") Low stock message Appears when stock falls below the number you set Size guide link Links to the matching tab (#ring, #bracelet, #necklace) of the size guide page Details tabs Shipping & returns, Material & care Rating line Stars and review count under the title, linking to the reviews Mobile sticky bar An add-to-cart bar stays at the bottom of the screen on phones/tablets Breadcrumb Home / collection / product Reviews Rating summary with a five-star distribution, \"Write a review\" button, and the list of reviews You may also like Products from the same collection Where the code lives: sections/main-product.liquid (2,400 lines), snippets/product-*.liquid , snippets/sale-badge.liquid , assets/photoswipe.js , assets/swatches.json . 6.7 Header, mega menus and language switcher Header designs: Classic and Modern . Sticky options: always fixed, appear on scroll up, or normal. Transparent header on the home page, product pages or collection pages, with its own light logo, text color and a dark gradient behind the menu. Mega menus: two kinds. Navigation Item Image gives a picture card to a menu link. Custom Mega Menu builds a full dropdown: columns, image cards, a promo image, and its own style. Hover dimming: other menu items soften while you hover one. Mobile menu drawer with expandable sub-menus. Account icon with a small avatar : the customer's picture, or their initial, or a default icon. Language switcher (desktop toggle with a flag or text label, and a mobile version) using Shopify's native localization and your Translate & Adapt languages. Flags are drawn as sharp-cornered inline graphics. Cart icon opening the drawer. Where the code lives: sections/header.liquid , snippets/header-mega-menu.liquid , snippets/nav-item.liquid , snippets/nav-item-mobile.liquid , snippets/header-account-avatar.liquid , snippets/header-language-switcher.liquid , snippets/country-flag.liquid . 6.8 Search A search pop-down opens from the header and shows live suggestions (products, collections, pages, articles) while the customer types. The search results page has popular search chips and collection suggestions. Where the code lives: snippets/search-predictive.liquid (the box), sections/predictive-search.liquid (the results), sections/main-search.liquid (results page). 6.9 Collection page Filters, sorting, a grid / list switch, products-per-page dropdown, sub-collection buttons, a header band, and numbered pagination. Columns can be set for six screen widths. Where the code lives: sections/main-collection.liquid , snippets/pagination.liquid , snippets/pagination-css.liquid , optional sections/collection-banner.liquid . 6.10 Sale badges and prices A badge appears on discounted products on cards and on the product page. Styles: classic ribbon, fine jewelry tag, heritage seal, minimal capsule, minimal square. Text: percentage off or \"SALE\". Colors and shape are editable. Prices can show the currency code (for example \"EUR\") and have four designs (clean classic, editorial serif, modern bold, fine gold underline). How you control it: Theme settings > Price & Badges . Where the code lives: snippets/sale-badge.liquid , snippets/sale-badge-css.liquid . 6.11 Banners and showcases Feature What it does Section Homepage banner Full-screen or classic hero, image or video, separate mobile media, slides, scroll arrow section-slideshow Collection banner 3:1 banner above a collection grid collection-banner Split layout Sticky banner/media next to a product grid (classic) or editorial header over a showcase (new) collection-split Moving product showcase A banner that rotates chosen products with a fade-and-zoom or slide animation, pauses on hover, supports swipe, dots and captions inside collection-split and product-showcase Product showcase Editorial header with a bleeding carousel, or sticky portrait media with a product grid product-showcase Parallax showcase Two product columns that scroll by themselves around a video parallax-showcase Mosaic Grid of image/video tiles section-mosaic Sale banner Promotional banner with focal-point controls sale Showcase video Autoplaying muted looping video with an accessible pause/play button used by banners Where the code lives: snippets/banner-media.liquid , banner-video.liquid , banner-overlay.liquid , banner-text-style.liquid , showcase-video.liquid , split-showcase-banner.liquid , product-showcase-render.liquid , assets/banner.js , assets/banner.css , assets/product-showcase.js (web components <product-showcase-slider> , <showcase-video> , <split-showcase-banner> ). 6.12 Size guide A page with one tab per jewelry type . Each tab has a size chart, \"how to measure\" steps, tips, an optional picture and an interactive ring size calculator . Product pages link to the right tab. How you control it: edit the Guide (tab) blocks of the Size guide section. See Size guide . 6.13 Landing pages: About, Permanent Jewelry, FAQ, Contact All four are designs of the Page Content section ( main-page ), chosen by the page template. Page Design About Story landing with an auto-rotating slideshow of product secondary images, values, numbers and a bottom banner ( snippets/about-story.liquid ) Permanent Jewelry On-site service landing with a rotating \"atelier\" showcase, hero slides, a metallurgy/story section, numbered steps and CTAs ( snippets/service-landing.liquid ) FAQ Category list with search on the left and an animated accordion on the right, plus a contact box ( snippets/faq-accordion.liquid ) Contact A designed layout with the contact form and contact hours Service/policy pages A text page with a side menu 6.14 Customer account dashboard A branded replacement for the classic account page, with a side navigation: Overview, Orders, Addresses, Saved . Orders: a list (number, date, thumbnails, status, total), and an order pop-up with status, tracking, items with properties (engraving), price breakdown and addresses. Addresses: add, edit and delete from pop-up forms. Saved: the wishlist. A friendly sign-in invitation for visitors who are not signed in. Where the code lives: sections/main-account-dashboard.liquid (about 2,900 lines), snippets/account-order-row.liquid , snippets/account-order-modal.liquid , snippets/header-account-avatar.liquid . The classic Shopify account templates are also styled: templates/customers/*.liquid . 6.15 Newsletter and password page The footer and the password page have a newsletter box. Submitting it creates a Shopify customer with email marketing consent and the tag newsletter (Shopify's own customer form), and calls the welcome-email service which emails the discount code. See Backend services . The password page shows a badge, heading, optional signup and three trust badges. Where the code lives: snippets/footer-newsletter.liquid , sections/main-password.liquid , layout/password.liquid . 6.16 Reviews Eight card designs, a \"Write a review\" form with three designs, rating summary, filters, and sign-in-only submissions. See the full chapter: 7. Reviews system . 6.17 Loading states Skeleton shimmer/pulse on product cards while images load. A branded animated loader (a streaming marquee of delicate jewelry icons) on the product page while the gallery loads. Controlled in Theme settings > Loading & skeleton . Code: snippets/loading-states.liquid , snippets/lv-loader.liquid . 6.18 Cookie banner and policy pages Shopify's native Customer Privacy cookie banner and preferences window are restyled to match the store ( snippets/cookie-banner-css.liquid ). Shopify's policy pages (refund, shipping, privacy, terms) are styled to match ( snippets/policy-page-css.liquid ). 6.19 Gift card page templates/gift_card.liquid shows the card value and balance, the code, a QR code and an add-to-wallet button, in the store's style. 6.20 SEO and social sharing A page title built from the page, tags, page number and shop name; canonical URL; meta description (with a default Aurelle description on the home page when none is set). Open Graph and Twitter tags for nice previews when links are shared ( snippets/social-meta-tags.liquid ). Breadcrumbs on collection, product and content pages. 6.21 Work in progress Item State Category metafields on the product page ( snippets/product-category-metafields.liquid ) Planned feature to show Shopify's standard category attributes (Color, Jewelry material, Jewelry type) as chips. At the moment the snippet only writes a hidden HTML comment and shows nothing Reviews: signed-in only Implemented in the theme ( review-form ) and in the review service. Requires the Review signing secret to match on both sides (see Reviews system ) ","reviews-system":" 7. Reviews system Customers can read reviews on the home page and product pages and write their own review (with a star rating and an optional photo). This chapter explains the whole system from the customer's point of view, the store team's point of view, and the developer's. 7.1 In one minute A customer opens a product and clicks Write a review . If they are not signed in , the pop-up asks them to sign in or create an account. If they are signed in , they see a form. Their name comes from their account automatically. They choose stars, write a short title and text, and can add a photo. The product is already selected and cannot be changed. The review is sent to the review service (a small serverless application on Vercel). The service checks it and saves it in Shopify as a draft . A team member approves it in Shopify Admin ( Content > Metaobjects > Review , set to Active ). The review now appears on the product page, in the rating summary and (if the home page reviews section is on) on the home page. Customer ──► theme form ──► review service (Vercel) ──► Shopify \"review\" metaobject (DRAFT) │ approved by team (ACTIVE) Shop visitors ◄── product page / home page ◄── theme reads active reviews 7.2 What visitors see Place What is shown Section Under the product title Stars and review count, linking down to the reviews snippets/product-rating.liquid Product page summary Average, a five-star distribution bar chart and a Write a review button snippets/product-review-summary.liquid Product page review list Reviews of this product, with filter by rating, sort order, \"show more\" sections/product-reviews.liquid Home page \"What our customers say\" with an average rating sections/customer-feedback.liquid The eight review card designs Choose one for the whole store in Theme settings > Reviews > Review card layout . It affects the home page and the product pages. Design Look Luxury minimal Clean bordered cards with a soft shadow Customer photo cards The customer's photo (or the product image) takes the top of the card Editorial magazine A large feature card with serif text next to smaller cards Modern rating grid Cards with a gold top line Masonry gallery Cards of different heights fitted together without gaps Swipe carousel Cards in a row with arrows; swipe on phones Parallax review wall Cards that move at slightly different speeds when scrolling Speech bubble slider (current) Quote icon and heading on the left, speech-bubble cards you swipe through, with the customer's avatar, name and date below each bubble and a progress bar Older names ( editorial , spotlight , journal ) from earlier versions are mapped automatically to the newer designs. All designs adapt to the width of each card, not only to the screen, so they look right on phones, tablets and desktops. Home page reviews section Settings: heading, subheading, average rating on/off, source (Auto: metaobject reviews, otherwise your blocks; Metaobject only; Blocks only), maximum reviews, how many show before \"Show more\", columns, autoplay (carousel and speech bubble), and a divider line. For the speech bubble design there are extra text settings for the two-line heading, the side title and the source label. Full list: Customer feedback . Product page reviews section Settings: heading, how many reviews to show first, spacing. See Product reviews . 7.3 The \"Write a review\" pop-up Chosen in Theme settings > Reviews > Review submission form : Design Look Elegant popup (current) A centered window Split screen A picture on the left and the form on the right (set the picture in Review form image ) Step by step Three steps: rating, your story, details Behavior On phones the window is a bottom sheet : it slides up from the bottom, can be dragged down by its handle to close, closes by sliding down, keeps the Submit button visible and stops the page behind from scrolling. The product is chosen automatically on a product page. The field is read-only and has no \"(optional)\" label. On a page without a product a product search box is shown instead. Name and email are not typed: they come from the customer's account. The photo (JPG, PNG or WebP) is resized in the browser to a JPEG under about 1.2 MB before upload. A preview is shown with a \"Remove photo\" link. Not signed in: the window shows \"Sign in to write a review\" with Sign in and Create account buttons. After signing in the customer returns to the product's review area. After a successful submit a Thank you message explains that the review will appear after approval. Rules checked by the service At least 10 characters in the review text. No links ( http:// , https:// , www. ) in the text or title. A rating of 1 to 5. Maximum 3 submissions per minute from one IP address (best effort). A hidden \"honeypot\" field catches simple spam bots. 7.4 Who can write a review: signed-in customers only The theme and the service work together to make sure a review really comes from a signed-in customer: When a signed-in customer opens the form, the theme creates a small signed token containing the customer id, email, name and the current time. It is signed with the Review signing secret (Theme settings > Reviews). The form sends this token with the review. The service recomputes the signature with the same secret (set as the environment variable REVIEW_SIGNING_SECRET ). If it matches and the token is not older than 12 hours, the review is accepted, and the name comes from the token , never from what was typed. If the token is missing or wrong, the service replies 401 and the form shows \"Please sign in to your account (and refresh the page) to write a review.\" Both secrets must be exactly the same. Pasting a trailing space in one of them is a common mistake (the service trims spaces, the theme trims too). The email address is not stored on the public review. The review metaobject can be read by the storefront, so putting an email there would make it public. The email only travels in the token. If you want to store it, see the service options in Backend services . 7.5 Approving and managing reviews (store team) Content > Metaobjects > Review shows every review. Draft reviews are waiting for approval. Open a review to read it. Check the text, the photo and the product. Set the status to Active to publish, or Draft to hide. Delete a review to remove it. Fields of a review: Field Meaning Name The customer's name shown on the review Rating 1 to 5 Title Optional headline Body The review text Photo Optional customer photo (file) Product The reviewed product Verified Marks a verified buyer (shows a badge). New reviews are saved as not verified ; change it by hand if you confirm the purchase Approved True when approved (older reviews). Reviews are shown only when approved and Active Date The date submitted You can also add a review yourself with Add entry (for example testimonials you collected by email). 7.6 How everything is wired (for developers) Theme files File Role sections/customer-feedback.liquid Home page reviews (metaobject or manual blocks). Sorts newest first, keeps the DOM in the same order as the visible order, \"Show more\", carousel/masonry/parallax/speech bubble behavior sections/product-reviews.liquid Product page reviews: filter, sort, show more, arrows (carousel/speech bubble) snippets/feedback-card.liquid Card used by the first seven designs snippets/feedback-bubble.liquid Card used by the speech bubble design snippets/feedback-stats.liquid Average and count for the home section snippets/product-review-stats.liquid Average, count and the five-star distribution for one product snippets/product-review-summary.liquid Summary box and the Write a review button snippets/product-rating.liquid Small \"★★★★★ 4.8 (12)\" line under the title snippets/rating-stars.liquid Draws stars, including half stars snippets/review-form.liquid The pop-up: sign-in panel or form, photo compression, product lock, token creation, bottom sheet behavior snippets/review-parallax-script.liquid Scroll speed differences for the parallax wall design config/settings_schema.json (group Reviews ) review_design , show_review_product_image , review_signing_secret , review_form_design , review_form_image , reviews_api_url Data Metaobject type review with storefront read access. Status uses the metaobject publishable capability (Draft / Active). The theme reads shop.metaobjects.review.values . Service endpoint POST {Reviews API URL} (default https://your-reviews-service.vercel.app/api/review ). Body (JSON): rating , title , body , productId , photoData (a JPEG data URL), website (honeypot, must be empty), customerToken . Responses: { ok: true } on success; { ok: false, error } otherwise ( 400 invalid, 401 not signed in, 403 origin not allowed, 429 too many requests, 502 Shopify problem). The 401 body also contains a short reason : no_token , bad_signature , expired , no_secret or bad_payload , and the browser console prints it. 7.7 Setup checklist The Shopify store has a metaobject definition of type review with the required fields ( name , rating , title , body , photo as File, product , verified , approved , date ) and Storefronts: read access. The review service is deployed on Vercel at https://your-reviews-service.vercel.app with its environment variables (see Backend services ). The Shopify Partner/Custom App (e.g. version reviews-2 ) has the scopes read_files,write_files,read_metaobjects,write_metaobjects,read_products active and released. The service's ALLOWED_ORIGINS contains https://shopify-jewelry.bssoln.com , https://your-store.myshopify.com , and local testing origins ( http://127.0.0.1:9292 , http://localhost:9292 ). Review signing secret in Theme settings equals REVIEW_SIGNING_SECRET in Vercel Production environment. The Reviews API URL setting (or its default) points to the deployed service. Customer accounts are enabled in Shopify Admin so customers can sign in. 7.8 Troubleshooting Symptom Likely cause and fix \"Please sign in ... refresh the page\" although signed in Open the browser console (F12) and read Reason . bad_signature : the two secrets differ, copy them again. no_secret : the Vercel variable is missing for the Production environment, add it and redeploy with vercel --prod . expired : the page was open more than 12 hours, refresh \"Origin not allowed\" (403) Add the store domain (for example https://shopify-jewelry.bssoln.com and https://your-store.myshopify.com ) to ALLOWED_ORIGINS on Vercel and redeploy Review saved but not visible It is still a Draft . Set it to Active in Content > Metaobjects > Review . Or verify the metaobject definition allows Storefront reading \"Customer photo uploads are not enabled for this review service yet\" The Shopify app lacks write_files scope in its active version. Create and release an app version with read_files,write_files,read_metaobjects,write_metaobjects,read_products in the Shopify Partner Dashboard \"Could not attach the image. Check that the review metaobject has a photo file field\" In Shopify Admin > Settings > Custom data > Metaobjects > Review, add a field named photo with type File (Accept images) The form shows \"Reviews can't be submitted right now\" The signing secret is empty in Theme settings > Reviews Some reviews do not show Liquid reads only the first 50 metaobject entries storewide (see known limits below) Pop-up always visible on phones Fixed in the current theme (a closed pop-up is always hidden). Hard refresh the page Known limits 50-review limit. Liquid can read only the first 50 metaobject entries of a type, across the whole store . Once the store has more than 50 reviews in total, the others do not appear in lists, averages and counts. If you expect many reviews, ask a developer to move the reads to the Storefront API with pagination, or to store a rating summary on each product. Reviews are not marked verified automatically. One customer can submit several reviews for the same product (only a per-minute limit exists). The service keeps a best-effort per-minute limit in memory. It resets when the serverless instance restarts. ","backend-services":" 8. Backend services (custom applications) Shopify themes cannot safely do a few things on their own: write data into the store, send emails, or keep secrets. For these jobs the project has a small serverless application hosted on Vercel . It is one Vercel project named your-reviews-service (address https://your-reviews-service.vercel.app ) with several endpoints. Plain-English summary. Think of it as a small assistant that lives on the internet. The theme calls it when a customer submits a review or subscribes to the newsletter. It does the secure part (saving the review, sending the welcome email) and replies. 8.1 Overview Endpoint Purpose Called by Status when this documentation was written POST /api/review Save a customer review as a draft in Shopify (only for signed-in customers) The review form ( snippets/review-form.liquid ) Live POST /api/welcome-email (and GET for a health check) Send the welcome email with the discount code to a new subscriber Footer newsletter and password page Live GET/POST /api/campaign A small campaign tool (page + sender) for emailing newsletter subscribers The store team, inside Shopify Admin Code exists, not currently deployed (returns 404) GET /api/unsubscribe A branded \"you have been unsubscribed\" page The unsubscribe link in campaign emails Code exists, not currently deployed (returns 404) _email-layout.js Shared light email layout used by campaign and welcome email Internal Code exists, not deployed Where the code is Folder Content Note reviews-api/ (inside the theme repository) api/review.js (with HMAC customer token check, staged upload photo pipeline, and draft metaobject creation) and api/welcome-email.js (dark-style welcome email) This is the active production code. Linked to the Vercel project your-reviews-service Reviews_API/ (a separate folder next to the repository) api/campaign.js , api/unsubscribe.js , api/_email-layout.js , an alternative api/welcome-email.js (light layout, unsubscribe link) and an older api/review.js Linked to the same Vercel project. Whichever folder was deployed last decides what is live. The latest deployment came from reviews-api/ , so campaign and unsubscribe are currently offline Important for the next developer. The two folders are linked to the same Vercel project, which means deploying from one folder removes the endpoints that only exist in the other. Before deploying, merge everything you want to keep into one folder (see 8.7 ). Never deploy the old review.js over the new one: it has no sign-in check and no photo upload. 8.2 Review service What it does: accepts a review from the storefront, checks it, and creates a draft review metaobject in Shopify. Request (JSON): rating (1 to 5), title (optional), body , productId , photoData (optional compressed JPEG as a data URL), website (honeypot), customerToken (signed proof of sign-in). What it checks, in order CORS: the request must come from an allowed website ( ALLOWED_ORIGINS ). A hidden honeypot field must be empty (bots fill it; they receive a fake success). Rate limit: 3 requests per minute per IP address (kept in memory, best effort). Sign-in : the signed token is verified with REVIEW_SIGNING_SECRET and must be no older than 12 hours (configurable). The name comes from the token. Rating 1 to 5, text of at least 10 characters, no links. Optional photo: it must be a compressed JPEG under about 1.2 MB. It is uploaded to Shopify Files and attached to the review. The draft review is created ( approved false, verified false, status Draft, today's date, the product). Responses: 200 { ok: true } , 400 invalid input, 401 not signed in (with a reason ), 403 origin not allowed, 405 wrong method, 429 too many requests, 500 not configured, 502 Shopify could not save. Environment variables Variable Required Purpose SHOPIFY_STORE_DOMAIN yes The .myshopify.com domain of the store SHOPIFY_CLIENT_ID , SHOPIFY_CLIENT_SECRET yes (or the token below) Shopify app credentials. The service exchanges them for a 24-hour Admin API token and refreshes it automatically SHOPIFY_ADMIN_TOKEN optional fallback A fixed Admin API token, used if the client credentials are not set ALLOWED_ORIGINS yes Comma-separated list of websites allowed to call the service, for example https://shopify-jewelry.bssoln.com . Local testing needs http://127.0.0.1:9292 REVIEW_SIGNING_SECRET yes Must equal the theme setting Review signing secret REVIEW_REQUIRE_LOGIN optional (default true ) Set to false only if you want anyone to review REVIEW_TOKEN_TTL_HOURS optional (default 12) How long a sign-in token stays valid REVIEW_STORE_EMAIL optional (default false ) true saves the customer's email in an email field of the review. Warning: the review can be read by the storefront, so the email would become public. Leave it off DEFAULT_PRODUCT_ID optional Product used when a review is sent without a product Shopify permissions needed: read/write metaobjects ( write_metaobjects ), and files ( write_files ) for photos. See also 7. Reviews system . 8.3 Welcome email What it does: when someone subscribes to the newsletter (footer or password page) the theme calls this endpoint. It sends a welcome email with the discount code through Gmail SMTP (Nodemailer). Accepts { email, name } or a Shopify webhook style payload ( customer.email , customer.first_name ). Validates the email address. Subject: \"Welcome to Aurelle — Your 10% Gift Inside\" , with a plain-text version and an HTML version (black and gold design with the code, a \"Explore The Collection\" button and three highlights: waterproof, tarnish-free steel, custom engraved). GET /api/welcome-email returns a small JSON status (\"ready\": true when Gmail is configured). If Gmail is not configured the endpoint answers success in \"simulation\" mode without sending. Environment variables: GMAIL_USER (the sending address; default store.bssoln@gmail.com ), GMAIL_APP_PASSWORD (a Google app password , not the normal password), WELCOME_DISCOUNT_CODE (default WELCOME10 ), STORE_URL , ALLOWED_ORIGINS . The discount code must exist in Shopify. The email only displays the code. Create WELCOME10 (or the code you set) in Discounts , otherwise customers cannot use it. The theme calls the service at the address written in snippets/footer-newsletter.liquid and sections/main-password.liquid (see Maintenance ). Limits: Gmail restricts how many emails one account can send per day, and Gmail may mark bulk mail as spam. For high volumes move to a transactional email provider. 8.4 Email campaign tool (Code in Reviews_API/api/campaign.js ; currently not deployed.) A self-contained page that lets the team send a branded email to newsletter subscribers. What the page offers Fields for subject , heading , message , discount code , button text and button link , and a preview text . A live preview in a desktop or mobile frame. Audience: all newsletter subscribers (read from Shopify customers who are subscribed to email marketing) or a custom list of email addresses. Send test email to yourself first, then Send to all . Every email carries an unsubscribe link and standard List-Unsubscribe headers. Security (read before deploying). The page is meant to open only inside Shopify Admin. It checks for the embedded-app address parameters ( embedded , host , shop ), an iframe request, or a bypass_key parameter, and then issues a 6-hour session token that every send request must include. These checks only look at the address, they do not verify that the request really came from Shopify. Anyone who knows the address could add ?shop=... and obtain the page and a token, and then email every subscriber. Do not deploy this tool as it is. Before using it, a developer must verify Shopify's signed request (HMAC or session token), or protect the page with a secret, and remove the bypass_key shortcut and the built-in fallback signing string. Environment variables: GMAIL_USER , GMAIL_APP_PASSWORD , SHOPIFY_STORE_DOMAIN , SHOPIFY_CLIENT_ID / SHOPIFY_CLIENT_SECRET (or CAMPAIGN_CLIENT_ID / CAMPAIGN_CLIENT_SECRET , or SHOPIFY_ADMIN_TOKEN ), CONTACT_EMAIL , EMAIL_LOGO_URL . Limits It reads only the first 100 customers from Shopify. It sends one email at a time, so a very large list can exceed the time a serverless function is allowed to run. Gmail daily sending limits apply. 8.5 Unsubscribe page (Code in
