/* Layout: fixed left navigation, one reading column, optional "on this page" rail.
   Palette is the store's own: ink, gold metal, hairline. Type is the store's own: Playfair Display + Quicksand. */
:root {
  --bg: #ffffff;
  --panel: #f6f5f2;
  --fg: #1d1b18;
  --muted: #6a665e;
  --line: #e6e3dc;
  --accent: #8a6a3a;
  --accent-soft: #f3ece0;
  --code-bg: #f1efea;
  --mark: #f8e3a6;
  --head: "Playfair Display", Georgia, "Times New Roman", serif;
  --body: "Quicksand", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  --nav-w: 288px;
  --header-h: 56px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151412; --panel: #1b1a17; --fg: #ebe9e4; --muted: #a29d93; --line: #2d2b27;
    --accent: #cfa968; --accent-soft: #2a241a; --code-bg: #211f1b; --mark: #5b4a1d; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #151412; --panel: #1b1a17; --fg: #ebe9e4; --muted: #a29d93; --line: #2d2b27;
  --accent: #cfa968; --accent-soft: #2a241a; --code-bg: #211f1b; --mark: #5b4a1d; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15.5px; line-height: 1.7; font-weight: 500; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--bg); }
a { color: var(--accent); text-underline-offset: 3px; }
a:hover { text-decoration-thickness: 2px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); border-bottom: 1px solid var(--line); }
.top-in { display: flex; align-items: center; gap: 12px; height: var(--header-h); padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
.brand { font-family: var(--head); font-size: 20px; letter-spacing: .01em; white-space: nowrap; text-decoration: none; color: var(--fg); }
.brand small { font-family: var(--body); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-left: 10px; font-weight: 700; }
.search { flex: 1 1 auto; max-width: 460px; margin-left: auto; position: relative; min-width: 0; }
.search input { width: 100%; height: 38px; padding: 0 12px 0 36px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); font: inherit; font-size: 14px; border-radius: 6px; }
.search svg { position: absolute; left: 11px; top: 11px; width: 16px; height: 16px; color: var(--muted); pointer-events: none; }
.iconbtn { flex: none; width: 38px; height: 38px; border: 1px solid var(--line); background: var(--panel); border-radius: 6px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
.iconbtn svg { width: 18px; height: 18px; }
#menuBtn { display: none; }

/* shell */
.shell { display: grid; grid-template-columns: var(--nav-w) minmax(0, 1fr); padding-left: var(--gutter-l); padding-right: var(--gutter-r); max-width: 1560px; margin: 0 auto; }
.nav { position: sticky; top: calc(var(--header-h) + env(safe-area-inset-top, 0px)); align-self: start; height: calc(100vh - var(--header-h) - env(safe-area-inset-top, 0px)); height: calc(100dvh - var(--header-h) - env(safe-area-inset-top, 0px)); overflow-y: auto; padding: 22px 18px 40px 0; border-right: 1px solid var(--line); font-size: 14px; }
.nav h6 { margin: 20px 0 6px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.nav h6:first-child { margin-top: 0; }
.nav a { display: block; padding: 5px 10px; border-radius: 5px; color: var(--fg); text-decoration: none; line-height: 1.4; }
.nav a:hover { background: var(--panel); }
.nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.nav details { margin: 20px 0 0; }
.nav summary { cursor: pointer; list-style: none; margin-bottom: 6px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 700; display: flex; justify-content: space-between; }
.nav summary::-webkit-details-marker { display: none; }
.nav summary::after { content: "+"; }
.nav details[open] summary::after { content: "–"; }

.main { display: grid; grid-template-columns: minmax(0, 1fr) 220px; gap: 48px; padding: 36px 0 80px 44px; min-width: 0; }
.doc { min-width: 0; max-width: 880px; }
.toc { position: sticky; top: calc(var(--header-h) + env(safe-area-inset-top, 0px) + 24px); align-self: start; max-height: calc(100vh - 140px); overflow-y: auto; font-size: 13px; line-height: 1.45; border-left: 1px solid var(--line); padding-left: 16px; }
.toc b { display: block; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.toc a { display: block; padding: 3px 0; color: var(--muted); text-decoration: none; }
.toc a:hover { color: var(--accent); }
.toc a.l3 { padding-left: 12px; }

/* prose */
.doc h1, .doc h2, .doc h3, .doc h4 { font-family: var(--head); font-weight: 500; line-height: 1.22; text-wrap: balance; scroll-margin-top: calc(var(--header-h) + env(safe-area-inset-top, 0px) + 18px); }
.doc h1 { font-size: 38px; margin: 0 0 18px; letter-spacing: -.005em; }
.doc h2 { font-size: 27px; margin: 2.2em 0 .6em; padding-top: 1.1em; border-top: 1px solid var(--line); }
.doc h3 { font-size: 20.5px; margin: 1.8em 0 .5em; }
.doc h4 { font-size: 17px; margin: 1.5em 0 .4em; }
.doc p, .doc li { max-width: 74ch; }
.doc ul, .doc ol { padding-left: 1.4em; }
.doc li { margin: .3em 0; }
.doc hr { border: 0; border-top: 1px solid var(--line); margin: 2em 0; }
.doc blockquote { margin: 1.3em 0; padding: 12px 18px; background: var(--accent-soft); border-left: 3px solid var(--accent); border-radius: 0 6px 6px 0; max-width: 74ch; }
.doc blockquote p { margin: .4em 0; }
.doc code { font-family: var(--mono); font-size: .86em; background: var(--code-bg); padding: .12em .38em; border-radius: 4px; overflow-wrap: anywhere; }
.doc pre { background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; overflow-x: auto; line-height: 1.5; max-width: 100%; }
.doc pre code { background: none; padding: 0; font-size: 12.5px; overflow-wrap: normal; white-space: pre; }
.tablewrap { overflow-x: auto; margin: 1.2em 0; border: 1px solid var(--line); border-radius: 8px; }
.doc table { border-collapse: collapse; width: 100%; font-size: 13.8px; line-height: 1.5; }
.doc th { text-align: left; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); background: var(--panel); padding: 10px 12px; white-space: nowrap; font-weight: 700; }
.doc td { padding: 10px 12px; border-top: 1px solid var(--line); vertical-align: top; min-width: 110px; }
.doc td:first-child { min-width: 150px; }
.doc td code { font-size: .82em; }
mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }

/* search results */
.results { padding: 36px 0 80px 44px; max-width: 880px; }
.results h1 { font-family: var(--head); font-weight: 500; font-size: 30px; margin: 0 0 6px; }

@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }

<template id="t-project-overview"><h1 id="1-project-overview">1. Project overview</h1>
<h2 id="11-what-this-project-is">1.1 What this project is</h2>
<p>This project is the complete online store for <strong>Aurelle Fine Jewelry</strong>, a premium jewelry brand selling handcrafted, waterproof and hypoallergenic jewelry with custom engraving. It runs on <strong>Shopify</strong> and was built by <strong>BSS Software Solutions</strong>.</p>
<p>It is made of four parts:</p>
<div class="tablewrap"><table><thead><tr>
<th>Part</th>
<th>What it is</th>
<th>Where it lives</th>
</tr>
</thead><tbody><tr>
<td><strong>1. The Shopify theme</strong> (&quot;Jewelry Shop&quot; v2.0.0)</td>
<td>Everything customers see: home page, collections, product pages, cart, account area, blog, search</td>
<td>This repository: <code>layout/</code>, <code>sections/</code>, <code>snippets/</code>, <code>templates/</code>, <code>assets/</code>, <code>config/</code>, <code>locales/</code></td>
</tr>
<tr>
<td><strong>2. Custom backend services</strong></td>
<td>Small serverless applications that do things Shopify cannot do alone: save reviews safely, send the welcome email, send email campaigns, handle unsubscribes</td>
<td><code>reviews-api/</code> in this repository, deployed to Vercel at <code>https://your-reviews-service.vercel.app</code></td>
</tr>
<tr>
<td><strong>3. Email templates</strong></td>
<td>17 branded versions of Shopify&#39;s order, shipping, account and marketing emails</td>
<td><code>Email_Templates/email-notification-templates.md</code> (copied into Shopify Admin)</td>
</tr>
<tr>
<td><strong>4. Catalog and data tools</strong></td>
<td>Scripts and data tools to create collections and menus, import products and photos, and generate lifestyle product images</td>
<td><code>_project_resources/</code> (scripts, CSV/JSON catalogs, image archives)</td>
</tr>
</tbody></table></div>
<p>The theme is built on the <strong>Pipeline</strong> theme framework by Groupthought Themes and has been heavily customized. All Aurelle-specific design, features and sections were added on top of it by BSS Software Solutions.</p>

<h2 id="13-what-customers-can-do-features-at-a-glance">1.3 What customers can do (features at a glance)</h2>
<ul>
<li>Browse a luxury-styled store with a transparent/sticky header and rich mega menus.</li>
<li>Filter, sort and switch between grid and list on collection pages.</li>
<li>Use the <strong>quick add</strong> and <strong>wishlist</strong> (heart) buttons on product cards. A <strong>quick view</strong> pop-up is built in and can be switched on in Theme settings &gt; Product Card (it is currently off).</li>
<li>Add <strong>custom engraving</strong> to a product with live character counting and tiered pricing.</li>
<li>See color swatches, variant pills, size guide links and a low-stock message on products.</li>
<li>Open a <strong>slide-out cart</strong> with a free-shipping progress message.</li>
<li>Read and write <strong>reviews</strong> with star ratings and photos (signed-in customers only).</li>
<li>Search with live suggestions.</li>
<li>Sign in to a branded <strong>account dashboard</strong> (orders, addresses, saved items).</li>
<li>Subscribe to the newsletter and receive a <strong>welcome email with a discount code</strong>.</li>
<li>Switch language, and see prices with the currency code.</li>
<li>Book or learn about the on-site <strong>Permanent Jewelry</strong> service.</li>
</ul>
<h2 id="14-what-the-store-team-can-do-admin-features">1.4 What the store team can do (admin features)</h2>
<ul>
<li>Rearrange and edit every page in the <strong>theme editor</strong> without code.</li>
<li>Change the <strong>whole color look</strong> with one palette dropdown.</li>
<li>Approve or hide customer reviews in Shopify Admin.</li>
<li>Send <strong>email campaigns</strong> to newsletter subscribers from a custom tool.</li>
<li>Import products, images and collections in bulk with the catalog tools.</li>
</ul>
<h2 id="15-how-the-pieces-connect">1.5 How the pieces connect</h2>
<pre><code>Customer browser
   │
   ├── loads pages from Shopify (the theme: Liquid + CSS + JavaScript)
   │       │
   │       ├── reads reviews, products, menus from Shopify
   │       └── uses Shopify&#39;s own cart, search and checkout
   │
   ├── submits a REVIEW ──────────► review service (Vercel) ──► creates a draft &quot;review&quot; in Shopify
   │
   └── subscribes to the NEWSLETTER ► Shopify customer form (stores the subscriber)
                                   └► welcome-email service (Vercel) ──► emails a discount code

Store team
   ├── approves reviews in Shopify Admin (Content &gt; Metaobjects &gt; Review)
   ├── sends campaigns from the campaign tool (served by the Vercel service)
   └── imports products with the catalog importer / scripts
</code></pre>

<h2 id="21-the-theme-editor-basics">2.1 The theme editor: basics</h2>
<ol>
<li>In Shopify Admin open <strong>Online Store &gt; Themes</strong>.</li>
<li>Click <strong>Customize</strong> on the live theme.</li>
<li>At the top, use the <strong>page selector</strong> (it says &quot;Home page&quot;) to open any page type: Home page, Products, Collections, Cart, Blog, Pages ...</li>
<li>The <strong>left sidebar</strong> lists the sections of that page. Click one to edit its settings; the page on the right updates live.</li>
<li>Click <strong>Save</strong> (top right) to make your changes live.</li>
</ol>
<p><strong>Safe editing tips</strong></p>
<ul>
<li>To experiment without risk, click the <strong>three dots</strong> next to the theme &gt; <strong>Duplicate</strong>, edit the copy, and <strong>Publish</strong> it when you are happy. Keep the old one as a backup.</li>
<li>The eye icon next to a section hides it without deleting it.</li>
<li><strong>Add section</strong> adds a new block to the page; <strong>Add block</strong> adds an item inside a section (a slide, a tile, a message).</li>
<li>Use the <strong>desktop / mobile</strong> icons at the top to check both layouts. Many settings have separate desktop and mobile values.</li>
</ul>
<hr>
<h2 id="22-home-page">2.2 Home page</h2>
<p>The home page is built from sections (see the list in <a href="#pages-and-templates" data-doc="pages-and-templates" data-anchor="the-home-page-in-detail">Pages and templates</a>).</p>
<h3 id="change-the-main-banner-hero">Change the main banner (hero)</h3>
<ol>
<li>Customize &gt; Home page &gt; <strong>Homepage banner</strong>.</li>
<li>Click the <strong>Slide</strong> block.</li>
<li>Choose <strong>Media type</strong> (image or video), then upload the <strong>desktop</strong> and <strong>mobile</strong> media.</li>
<li>Fill the small heading, big heading, button label and link.</li>
<li>Choose the <strong>text position</strong> and, if the picture is busy, adjust the <strong>dark overlay</strong>.</li>
<li>To add more slides, click <strong>Add block &gt; Slide</strong>. Turn on <strong>Auto-rotate slides</strong> in the section settings if you want them to change by themselves.</li>
</ol>
<blockquote>
<p>Tip: upload a different, taller picture for mobile so the product is not cut off.</p>
</blockquote>
<h3 id="change-the-category-tiles-mosaic">Change the category tiles (mosaic)</h3>
<ol>
<li>Customize &gt; Home page &gt; <strong>Mosaic &amp; Grid Banner</strong>.</li>
<li>Click a <strong>Tile</strong> block, upload a picture or video, set the title and link.</li>
<li>Add or remove tiles. The grid re-arranges itself depending on how many tiles you have.</li>
</ol>
<h3 id="feature-a-collection-next-to-a-picture">Feature a collection next to a picture</h3>
<p>Use <strong>Collection split</strong>: choose the <strong>collection</strong>, the banner image or video, the heading and the button. See <a href="#s-collection-split" data-doc="s-collection-split">Collection split</a>.</p>
<h3 id="show-a-sale-banner">Show a sale banner</h3>
<p>Use the <strong>Sale</strong> section: upload the image, write the heading and description, set the button link. If a person&#39;s face is cut off in the picture, change <strong>Desktop image focal position</strong> to a <strong>Top</strong> option. See <a href="#s-sale" data-doc="s-sale">Sale</a>.</p>
<h3 id="reorder-hide-or-delete-sections">Reorder, hide or delete sections</h3>
<p>Drag a section in the left list, click the eye to hide it, or click the three dots &gt; <strong>Remove</strong>.</p>
<hr>
<h2 id="23-announcement-bar-top-strip">2.3 Announcement bar (top strip)</h2>
<ol>
<li>Customize &gt; scroll to the top &gt; <strong>Announcement bar</strong>.</li>
<li>Click a <strong>Announcement</strong> block. Type the text and an optional link.</li>
<li>Add more blocks for more messages. They rotate automatically (change the speed with <strong>Slide speed</strong>).</li>
<li>For a designed message (animated gold text, a code you can click to copy), paste the HTML into <strong>Custom HTML</strong>. Leave it empty for a normal text message.</li>
</ol>
<hr>
<h2 id="24-menus-and-mega-menus">2.4 Menus and mega menus</h2>
<p><strong>Edit the links</strong></p>
<ol>
<li><strong>Content &gt; Menus</strong>.</li>
<li>Open <strong>Main menu</strong> (header) or <strong>Footer menu</strong> and add, rename or reorder links. Nested links become dropdown items.</li>
</ol>
<p><strong>Add pictures to dropdown menus</strong></p>
<ol>
<li>Customize &gt; <strong>Header</strong> section &gt; <strong>Add block</strong>.</li>
<li><strong>Navigation Item Image</strong> adds a picture card to a menu item.</li>
<li><strong>Custom Mega Menu</strong> builds a fully designed dropdown (columns, cards, a promo image) for one menu item.</li>
<li>In each block, type the <strong>exact title</strong> of the menu item (as written in <strong>Content &gt; Menus</strong>) so the design is attached to the right link. Rename it in both places if you rename the menu item.</li>
</ol>
<p><strong>Change how all dropdowns look</strong></p>
<p>Header section &gt; <strong>Global Dropdown Styling</strong>: background, text and hover colors, radius, shadow, font size.</p>
<hr>
<h2 id="25-products">2.5 Products</h2>
<h3 id="add-a-product">Add a product</h3>
<ol>
<li><strong>Products &gt; Add product</strong>.</li>
<li>Add a title, description and photos. The <strong>first photo</strong> is the main image; the <strong>second photo</strong> shows on hover in product grids.</li>
<li>Set the price. For a sale, set the <strong>Compare-at price</strong> higher than the price; the sale badge (for example &quot;-20%&quot;) appears automatically.</li>
<li>Add <strong>options</strong> (for example Size, Metal, Stone) and variants.</li>
<li>Assign the product to a <strong>collection</strong> (or use tags so automated collections pick it up).</li>
</ol>
<h3 id="make-a-product-engravable">Make a product engravable</h3>
<p>The engraving box appears when any of these is true (Theme settings &gt; Engraving &gt; <strong>Engraving field: Auto</strong>):</p>
<ul>
<li>the product title, type or a tag contains one of the <strong>engravable keywords</strong> (default: <code>engrav</code>, <code>graver</code>, <code>personali</code>), or</li>
<li>the product has an <strong>option whose name contains &quot;engrav&quot; or &quot;char&quot;</strong> (for example an option called <em>Engraving characters</em>).</li>
</ul>
<p><strong>Charging by number of characters:</strong> add an option named like <em>Engraving characters</em> with values such as <code>3 characters</code>, <code>5 characters</code>, <code>7 characters</code>, <code>10 characters</code>, <code>12 characters</code> and give each variant its own price. The product page shows the extra price on each pill (&quot;+€X&quot;) and limits the engraving text to the chosen number.</p>
<p>The text the customer types is saved on the order as a <strong>line item property</strong> named <em>Engraving</em> (the name can be changed in Theme settings &gt; Engraving).</p>
<h3 id="size-guide-link">Size guide link</h3>
<p>On the product section, choose the <strong>Size guide page</strong> (a page that uses the <code>page.size-guide</code> template). Rings, bracelets and necklaces then link to the right tab of the guide.</p>
<h3 id="category-details-color-material">Category details (color, material)</h3>
<p>The product page has a hook for Shopify&#39;s standard category metafields (Color, Jewelry material ...). It is not finished and shows nothing yet (see <a href="#maintenance-and-troubleshooting" data-doc="maintenance-and-troubleshooting" data-anchor="known-issues">Maintenance</a>).</p>
<hr>
<h2 id="26-collections">2.6 Collections</h2>
<ol>
<li><strong>Products &gt; Collections &gt; Create collection</strong> (manual, or automated with rules).</li>
<li>Add a <strong>collection image</strong>. The collection banner and the mega menu can use it.</li>
<li>The look of every collection page is set once: Customize &gt; <strong>Collections</strong> &gt; <strong>Collection Grid</strong> (columns, filters, sorting, products per page).</li>
<li>To add a hero banner to one kind of collection page, add the <strong>Collection banner</strong> section in the Collections template.</li>
</ol>
<p><strong>Filters</strong> (color, metal, price ...) are managed in the Shopify <strong>Search &amp; Discovery</strong> app, not in the theme.</p>
<hr>

<ol>
<li><p><strong>Online Store &gt; Pages &gt; Add page</strong>, write the content (if the design has a text area).</p>
</li>

<h2 id="28-reviews">2.8 Reviews</h2>
<p>Customers can write a review on any product page. Reviews are saved as <strong>drafts</strong> and appear on the store only after you approve them.</p>
<h3 id="approve-a-review">Approve a review</h3>
<ol>
<li><strong>Content &gt; Metaobjects &gt; Review</strong>.</li>
<li>Open a review. Read it. If it is fine, set its status to <strong>Active</strong> (published) and save. To hide it, set it to <strong>Draft</strong>.</li>
<li>Active reviews appear on the product page and (if the reviews section is on the home page) on the home page.</li>
</ol>
<h3 id="add-a-review-yourself">Add a review yourself</h3>
<p>In the same <strong>Review</strong> list click <strong>Add entry</strong> and fill name, rating (1 to 5), text, product, date, and tick <strong>approved</strong> and <strong>verified</strong>.</p>
<h3 id="show-hand-written-testimonials">Show hand-written testimonials</h3>
<p>In the home page <strong>Customer feedback</strong> section set <strong>Source &gt; Blocks below only</strong> and add <strong>Review</strong> blocks.</p>
<h3 id="change-how-reviews-look">Change how reviews look</h3>
<p>Customize &gt; Theme settings &gt; <strong>Reviews</strong> &gt; <strong>Review card layout</strong> (luxury minimal, customer photo cards, editorial magazine, modern grid, masonry, swipe carousel, parallax wall or speech bubble slider).</p>
<p>Customers must be <strong>signed in</strong> to write a review. For details and troubleshooting see <a href="#reviews-system" data-doc="reviews-system">Reviews system</a>.</p>
<hr>
<h2 id="29-newsletter-welcome-email-and-discounts">2.9 Newsletter, welcome email and discounts</h2>
<ul>
<li><strong>Newsletter box</strong>: the footer <strong>Newsletter</strong> settings. The text, button and the &quot;10% off&quot; badge are editable.</li>
<li>When a visitor subscribes, Shopify saves them as a <strong>customer</strong> with email marketing consent and the tag <strong>newsletter</strong>, and a <strong>welcome email with a discount code</strong> is sent automatically.</li>
<li><strong>Important:</strong> the code shown in the email and badge is just text. You must create the same code in <strong>Discounts &gt; Create discount</strong> (for example <code>WELCOME10</code>, 10% off) or customers will find that the code does not work. The code used in the email is set in the backend service (see <a href="#backend-services" data-doc="backend-services" data-anchor="83-welcome-email">Backend services</a>).</li>
<li>The password (coming soon) page has the same signup box.</li>
</ul>
<h3 id="send-an-email-campaign">Send an email campaign</h3>
<p>Use the campaign tool (see <a href="#backend-services" data-doc="backend-services" data-anchor="84-email-campaign-tool">Backend services</a>): write a subject, heading, text, optional discount code and button, send yourself a <strong>test email</strong> first, then send to all subscribers.</p>
<hr>
<h2 id="210-orders-shipping-and-customer-emails">2.10 Orders, shipping and customer emails</h2>
<p>Shopify sends emails for orders, shipping, refunds, account invitations and more. This project ships <strong>17 branded templates</strong> to make all of them match the store. To install or update one: <strong>Settings &gt; Notifications</strong>, open the email, paste the subject and code (full instructions in <a href="#email-templates" data-doc="email-templates">Email templates</a>).</p>
<p>Engraving text appears on the order and in emails as a property under the product name.</p>
<hr>
<h2 id="211-languages-and-texts">2.11 Languages and texts</h2>
<ul>
<li><strong>Settings &gt; Languages</strong> adds languages. The theme includes English and Dutch.</li>
<li>Fixed theme texts (button labels, messages): Customize &gt; bottom-left <strong>Edit default theme content</strong>.</li>
<li>Product, collection and page translations: the <strong>Translate &amp; Adapt</strong> app.</li>
<li>The <strong>language switcher</strong> in the header is switched on in the Header section (<strong>Show language switcher</strong>).</li>
</ul>
<hr>
<h2 id="212-logo-favicon-colors-and-fonts">2.12 Logo, favicon, colors and fonts</h2>
<ul>
<li><strong>Logo / favicon:</strong> Theme settings &gt; <strong>Logo &amp; Favicon (Global)</strong>.</li>
<li><strong>Whole color look:</strong> Theme settings &gt; <strong>Theme Palette</strong> (Champagne Gold, Rose Gold, Platinum, Emerald, Midnight or Custom).</li>
<li><strong>Fonts:</strong> Theme settings &gt; <strong>Typography</strong>.</li>
<li><strong>Buttons:</strong> Theme settings &gt; <strong>Buttons &amp; Controls</strong>.</li>
</ul>
<p>All details: <a href="#design-and-settings-guide" data-doc="design-and-settings-guide">Design and settings guide</a>.</p>
<hr>
<h2 id="213-customer-accounts">2.13 Customer accounts</h2>
<ul>
<li>Customers sign in with the branded <strong>Login</strong> page. After signing in they see the classic account pages, or the <strong>dashboard</strong> if you linked a page that uses the <code>page.account-dashboard</code> template.</li>
<li>The dashboard has <strong>Overview, Orders, Addresses and Saved (wishlist)</strong>. The wishlist lives in the customer&#39;s own browser.</li>
<li>Account settings (new or classic accounts) are in <strong>Settings &gt; Customer accounts</strong>.</li>
</ul>
<hr>
<h2 id="214-password-page-coming-soon--maintenance">2.14 Password page (coming soon / maintenance)</h2>
<p>To lock the store, <strong>Online Store &gt; Preferences &gt; Restrict access with a password</strong>. Visitors then see the branded password page, which can collect newsletter signups. Edit it in Customize &gt; <strong>Password page</strong>.</p>
<hr>
<h2 id="215-gift-cards">2.15 Gift cards</h2>
<p>Gift cards are created in <strong>Products &gt; Gift cards</strong>. The page a customer opens (balance, code, QR code and &quot;add to wallet&quot;) is part of the theme (<code>templates/gift_card.liquid</code>).</p>
<hr>
<h2 id="216-cookie-banner">2.16 Cookie banner</h2>
<p>The cookie / privacy banner is Shopify&#39;s built-in <strong>Customer Privacy</strong> banner, styled by the theme to look luxurious. You configure it in <strong>Settings &gt; Customer privacy</strong>.</p>
<hr>
<h2 id="217-before-you-publish-changes-checklist">2.17 Before you publish changes: checklist</h2>
<ul>
<li><input disabled="" type="checkbox"> Preview on <strong>desktop and mobile</strong> (editor icons).</li>
<li><input disabled="" type="checkbox"> Click every new button or link.</li>

<template id="t-design-and-settings-guide"><h1 id="3-design-and-settings-guide">3. Design and settings guide</h1>
<p>The look of the whole store is controlled from one place: <strong>Online Store &gt; Themes &gt; Customize &gt; Theme settings</strong> (click the gear / paintbrush icon at the bottom of the left bar). A change there updates every page at once.</p>
<p>This guide explains each group in plain language. For every single option and default value see the <a href="#ref-theme-settings" data-doc="ref-theme-settings">Theme settings reference</a>. For settings that belong to one section only (one banner, one grid) see the <a href="#sections-guide" data-doc="sections-guide">Sections guide</a>.</p>
<blockquote>
<p><strong>Rule of thumb:</strong> <em>Theme settings</em> change the look of the <strong>whole store</strong>. <em>Section settings</em> change <strong>one block of one page</strong>. If a section setting is left on its default, the theme setting is used.</p>
</blockquote>
<hr>

<div class="tablewrap"><table><thead><tr>
<th>What</th>
<th>How</th>
</tr>
</thead><tbody><tr>

<td>Turn on <strong>Use Shopify Brand Logo</strong> to use the logo from <strong>Settings &gt; Brand</strong>. Or upload a <strong>Custom Theme Logo</strong> here. The same logo is used in the header, mobile header, footer and password page.</td>
</tr>
<tr>
<td><strong>Logo size</strong></td>
<td>Separate widths for desktop, mobile and footer.</td>
</tr>
<tr>
<td><strong>Mobile alignment</strong></td>

</tr>
<tr>
<td><strong>Favicon</strong></td>
<td>The tiny icon in the browser tab (32 x 32 px).</td>
</tr>
</tbody></table></div>
<p>Checkout and the customer login page take their logo from <strong>Settings &gt; Brand</strong> in Shopify Admin, not from the theme.</p>

<h2 id="37-loading-and-skeleton">3.7 Loading and skeleton</h2>
<ul>
<li><strong>Skeleton:</strong> a soft shimmer or pulse shown on product cards while pictures load.</li>

</ul>

<ul>

<h2 id="39-buttons-and-controls">3.9 Buttons and controls</h2>
<p>Controls every button in the store: universal style (solid fill / outline / soft / minimal text), corner radius (0 = sharp), background, text and border colors, hover colors, border thickness, uppercase text, text size, weight and letter spacing, and the round buttons (icons in circles) colors. The <strong>brand accent</strong> (gold) is also set here.</p>
<blockquote>
<p>Individual sections can override these (for example a banner button set to &quot;Theme button&quot; follows these settings, while a &quot;Solid white&quot; button stays white).</p>

<template id="t-pages-and-templates"><h1 id="pages-and-templates">Pages and templates</h1>

<template id="t-sections-guide"><h1 id="sections-guide">Sections guide</h1>
<p>A <strong>section</strong> is a big building block of a page: a banner, a product grid, a header, a footer. In the theme editor you add, remove, reorder and edit sections without touching code. This theme has <strong>32 sections</strong> (plus the header and footer groups). Each one has its own page in this documentation with every setting explained.</p>
<h2 id="how-to-work-with-sections">How to work with sections</h2>
<ul>
<li><strong>Add:</strong> Customize &gt; open a page &gt; <strong>Add section</strong> &gt; choose a section.</li>
<li><strong>Reorder:</strong> drag the section by its handle in the left sidebar.</li>
<li><strong>Hide without deleting:</strong> click the eye icon next to the section.</li>
<li><strong>Edit:</strong> click the section, change settings on the left, and <strong>Save</strong>.</li>
<li>Some sections are <strong>fixed</strong> to a page (for example the product page, the cart or the header). You can edit them but not add a second copy.</li>
</ul>

<h2 id="61-custom-engraving">6.1 Custom engraving</h2>
<p><strong>What the customer sees</strong></p>
<ul>
<li>On engravable products a <strong>&quot;Personalise&quot; card</strong> (or a classic grey box) appears on the product page containing the <strong>character-count options</strong> and a <strong>text field</strong> with a live counter and a limit.</li>
<li>Option pills can show the extra price, for example &quot;+€X&quot;.</li>
<li>On product cards, an engravable product shows a <strong>&quot;Personalise&quot; hover bar</strong> (desktop) or a &quot;+&quot; button (phones) instead of size pills. It opens a <strong>popup</strong> with the engraving field and the options, or goes to the product page.</li>
<li>The text is saved on the cart line and the order as a <strong>line item property</strong> (named <em>Engraving</em> by default) and shows in the cart, the cart drawer and the order emails.</li>
</ul>
<p><strong>How you control it</strong></p>
<div class="tablewrap"><table><thead><tr>
<th>Where</th>
<th>What</th>
</tr>
</thead><tbody><tr>
<td>Theme settings &gt; <strong>Engraving</strong></td>
<td>When the field appears (auto, every product, never), the keywords that mark a product as engravable, the field label and placeholder, maximum characters, required or optional, the order property name, the card button text and what the card button does</td>
</tr>
<tr>
<td>Product page section &gt; <strong>Gallery &gt; Engraving layout</strong> and <strong>Personalise card color scheme</strong></td>
<td>Card look or classic look, and the card colors</td>
</tr>
<tr>
<td>The product itself</td>
<td>Option named like <em>Engraving characters</em> with values 3, 5, 7, 10, 12 and a price per variant. Or a keyword in the title, type or tags</td>
</tr>
</tbody></table></div>
<p><strong>How it decides a product is engravable (auto mode)</strong>: the product title, type, tags or an option name contains one of the keywords (default <code>engrav</code>, <code>graver</code>, <code>personali</code>; Dutch keywords work too), or an option name contains &quot;engrav&quot; or &quot;char&quot;.</p>
<p><strong>Where the code lives:</strong> <code>snippets/engraving-info.liquid</code> (single source of truth), <code>snippets/product-eng-wrap.liquid</code>, <code>snippets/product-engrave-field.liquid</code>, <code>snippets/card-engrave-bar.liquid</code>, <code>snippets/card-mini-add-assets.liquid</code> (card popup), <code>sections/main-product.liquid</code> (product page logic).</p>
<hr>
<h2 id="62-product-cards">6.2 Product cards</h2>
<p>The product card is one shared piece of code used by every product grid (collections, featured collections, search, related products).</p>
<p><strong>What the customer sees:</strong> main photo, <strong>second photo on hover</strong>, product name, price with sale badge, optional vendor, a <strong>wishlist heart</strong>, a <strong>quick add</strong> button, optional <strong>image arrows</strong> to browse the product&#39;s photos, and (for engravable items) the Personalise bar.</p>
<p><strong>On phones</strong> the card shows a compact <strong>&quot;+&quot; button</strong>. Tapping it opens a popup to choose the variant (slides up from the bottom, slides in from the side, appears above the button or over the image) and add to cart. In list view on mobile a normal Add to Cart button can show.</p>
<p><strong>How you control it:</strong> Theme settings &gt; <strong>Product Card</strong> (hover effect, second image on hover, alignment, vendor, quick add on desktop and mobile, popup style, wishlist, quick view, arrows and every arrow color and size). Grid columns for each screen size are set per section.</p>
<p><strong>Where the code lives:</strong> <code>snippets/product-grid-item.liquid</code>, <code>snippets/product-grid-vars.liquid</code>, <code>snippets/card-mini-add.liquid</code>, <code>snippets/card-mini-add-assets.liquid</code>, <code>assets/product-grid.css</code>.</p>
<hr>
<h2 id="63-quick-view">6.3 Quick view</h2>
<p>A pop-up product view opened from a card: photos, price, variants, engraving and add to cart without leaving the page. It is <strong>built in but switched off</strong> (Theme settings &gt; Product Card &gt; <strong>Enable Quick View modal</strong>). The same pop-up code also keeps the wishlist in sync.</p>

<template id="t-reviews-system"><h1 id="7-reviews-system">7. Reviews system</h1>
<p>Customers can read reviews on the home page and product pages and write their own review (with a star rating and an optional photo). This chapter explains the whole system from the customer&#39;s point of view, the store team&#39;s point of view, and the developer&#39;s.</p>
<hr>
<h2 id="71-in-one-minute">7.1 In one minute</h2>
<ol>
<li>A customer opens a product and clicks <strong>Write a review</strong>.</li>
<li>If they are <strong>not signed in</strong>, the pop-up asks them to sign in or create an account.</li>
<li>If they <strong>are signed in</strong>, they see a form. Their <strong>name</strong> comes from their account automatically. They choose stars, write a short title and text, and can add a photo. The product is already selected and cannot be changed.</li>
<li>The review is sent to the <strong>review service</strong> (a small serverless application on Vercel). The service checks it and saves it in Shopify as a <strong>draft</strong>.</li>
<li>A team member <strong>approves</strong> it in Shopify Admin (<strong>Content &gt; Metaobjects &gt; Review</strong>, set to <em>Active</em>).</li>
<li>The review now appears on the product page, in the rating summary and (if the home page reviews section is on) on the home page.</li>
</ol>
<pre><code>Customer ──► theme form ──► review service (Vercel) ──► Shopify &quot;review&quot; metaobject (DRAFT)
                                                              │ approved by team (ACTIVE)
Shop visitors ◄── product page / home page ◄── theme reads active reviews
</code></pre>
<hr>

<h2 id="73-the-write-a-review-pop-up">7.3 The &quot;Write a review&quot; pop-up</h2>
<p>Chosen in Theme settings &gt; Reviews &gt; <strong>Review submission form</strong>:</p>
<div class="tablewrap"><table><thead><tr>
<th>Design</th>
<th>Look</th>
</tr>
</thead><tbody><tr>
<td><strong>Elegant popup</strong> (current)</td>
<td>A centered window</td>
</tr>
<tr>
<td>Split screen</td>
<td>A picture on the left and the form on the right (set the picture in <strong>Review form image</strong>)</td>
</tr>
<tr>
<td>Step by step</td>
<td>Three steps: rating, your story, details</td>
</tr>
</tbody></table></div>
<p><strong>Behavior</strong></p>
<ul>
<li>On <strong>phones</strong> the window is a <strong>bottom sheet</strong>: it slides up from the bottom, can be dragged down by its handle to close, closes by sliding down, keeps the Submit button visible and stops the page behind from scrolling.</li>
<li>The <strong>product is chosen automatically</strong> on a product page. The field is read-only and has no &quot;(optional)&quot; label. On a page without a product a product search box is shown instead.</li>
<li><strong>Name and email</strong> are not typed: they come from the customer&#39;s account.</li>
<li>The <strong>photo</strong> (JPG, PNG or WebP) is resized in the browser to a JPEG under about 1.2 MB before upload. A preview is shown with a &quot;Remove photo&quot; link.</li>
<li><strong>Not signed in:</strong> the window shows &quot;Sign in to write a review&quot; with <strong>Sign in</strong> and <strong>Create account</strong> buttons. After signing in the customer returns to the product&#39;s review area.</li>
<li>After a successful submit a <strong>Thank you</strong> message explains that the review will appear after approval.</li>
</ul>
<p><strong>Rules checked by the service</strong></p>
<ul>
<li>At least 10 characters in the review text.</li>
<li>No links (<code>http://</code>, <code>https://</code>, <code>www.</code>) in the text or title.</li>
<li>A rating of 1 to 5.</li>
<li>Maximum 3 submissions per minute from one IP address (best effort).</li>
<li>A hidden &quot;honeypot&quot; field catches simple spam bots.</li>
</ul>
<hr>
<h2 id="74-who-can-write-a-review-signed-in-customers-only">7.4 Who can write a review: signed-in customers only</h2>
<p>The theme and the service work together to make sure a review really comes from a signed-in customer:</p>
<ol>
<li>When a signed-in customer opens the form, the <strong>theme</strong> creates a small signed token containing the customer id, email, name and the current time. It is signed with the <strong>Review signing secret</strong> (Theme settings &gt; Reviews).</li>
<li>The form sends this token with the review.</li>
<li>The <strong>service</strong> recomputes the signature with the same secret (set as the environment variable <code>REVIEW_SIGNING_SECRET</code>). If it matches and the token is not older than 12 hours, the review is accepted, and the <strong>name comes from the token</strong>, never from what was typed.</li>
<li>If the token is missing or wrong, the service replies <strong>401</strong> and the form shows &quot;Please sign in to your account (and refresh the page) to write a review.&quot;</li>
</ol>
<blockquote>
<p><strong>Both secrets must be exactly the same.</strong> Pasting a trailing space in one of them is a common mistake (the service trims spaces, the theme trims too).</p>
</blockquote>
<p><strong>The email address is not stored on the public review.</strong> The review metaobject can be read by the storefront, so putting an email there would make it public. The email only travels in the token. If you want to store it, see the service options in <a href="#backend-services" data-doc="backend-services" data-anchor="82-review-service">Backend services</a>.</p>
<hr>
<h2 id="75-approving-and-managing-reviews-store-team">7.5 Approving and managing reviews (store team)</h2>
<ol>
<li><strong>Content &gt; Metaobjects &gt; Review</strong> shows every review. Draft reviews are waiting for approval.</li>
<li>Open a review to read it. Check the text, the photo and the product.</li>
<li>Set the status to <strong>Active</strong> to publish, or <strong>Draft</strong> to hide. Delete a review to remove it.</li>
</ol>
<p>Fields of a review:</p>
<div class="tablewrap"><table><thead><tr>
<th>Field</th>
<th>Meaning</th>
</tr>
</thead><tbody><tr>
<td>Name</td>
<td>The customer&#39;s name shown on the review</td>
</tr>
<tr>
<td>Rating</td>
<td>1 to 5</td>
</tr>
<tr>
<td>Title</td>
<td>Optional headline</td>
</tr>
<tr>
<td>Body</td>
<td>The review text</td>
</tr>
<tr>
<td>Photo</td>
<td>Optional customer photo (file)</td>
</tr>
<tr>
<td>Product</td>
<td>The reviewed product</td>
</tr>
<tr>
<td>Verified</td>
<td>Marks a verified buyer (shows a badge). New reviews are saved as <em>not verified</em>; change it by hand if you confirm the purchase</td>
</tr>
<tr>
<td>Approved</td>
<td>True when approved (older reviews). Reviews are shown only when approved and Active</td>
</tr>
<tr>
<td>Date</td>
<td>The date submitted</td>
</tr>
</tbody></table></div>
<p>You can also <strong>add a review yourself</strong> with <em>Add entry</em> (for example testimonials you collected by email).</p>

<h2 id="78-troubleshooting">7.8 Troubleshooting</h2>
<div class="tablewrap"><table><thead><tr>
<th>Symptom</th>
<th>Likely cause and fix</th>
</tr>
</thead><tbody><tr>
<td>&quot;Please sign in ... refresh the page&quot; although signed in</td>
<td>Open the browser console (F12) and read <strong>Reason</strong>. <code>bad_signature</code>: the two secrets differ, copy them again. <code>no_secret</code>: the Vercel variable is missing for the Production environment, add it and redeploy with <code>vercel --prod</code>. <code>expired</code>: the page was open more than 12 hours, refresh</td>
</tr>
<tr>
<td>&quot;Origin not allowed&quot; (403)</td>
<td>Add the store domain (for example <code>https://shopify-jewelry.bssoln.com</code> and <code>https://your-store.myshopify.com</code>) to <code>ALLOWED_ORIGINS</code> on Vercel and redeploy</td>
</tr>
<tr>
<td>Review saved but not visible</td>
<td>It is still a <strong>Draft</strong>. Set it to Active in <strong>Content &gt; Metaobjects &gt; Review</strong>. Or verify the metaobject definition allows Storefront reading</td>
</tr>
<tr>
<td>&quot;Customer photo uploads are not enabled for this review service yet&quot;</td>
<td>The Shopify app lacks <code>write_files</code> scope in its active version. Create and release an app version with <code>read_files,write_files,read_metaobjects,write_metaobjects,read_products</code> in the Shopify Partner Dashboard</td>
</tr>
<tr>
<td>&quot;Could not attach the image. Check that the review metaobject has a photo file field&quot;</td>
<td>In Shopify Admin &gt; Settings &gt; Custom data &gt; Metaobjects &gt; Review, add a field named <code>photo</code> with type <strong>File</strong> (Accept images)</td>
</tr>
<tr>
<td>The form shows &quot;Reviews can&#39;t be submitted right now&quot;</td>
<td>The signing secret is empty in Theme settings &gt; Reviews</td>
</tr>
<tr>
<td>Some reviews do not show</td>
<td>Liquid reads only the first 50 metaobject entries storewide (see known limits below)</td>
</tr>
<tr>
<td>Pop-up always visible on phones</td>
<td>Fixed in the current theme (a closed pop-up is always hidden). Hard refresh the page</td>
</tr>
</tbody></table></div>
<h3 id="known-limits">Known limits</h3>
<ul>
<li><strong>50-review limit.</strong> Liquid can read only the <strong>first 50 metaobject entries</strong> of a type, <strong>across the whole store</strong>. Once the store has more than 50 reviews in total, the others do not appear in lists, averages and counts. If you expect many reviews, ask a developer to move the reads to the Storefront API with pagination, or to store a rating summary on each product.</li>
<li>Reviews are not marked <em>verified</em> automatically.</li>
<li>One customer can submit several reviews for the same product (only a per-minute limit exists).</li>
<li>The service keeps a best-effort per-minute limit in memory. It resets when the serverless instance restarts.</li>
</ul>
</template>

<h2 id="82-review-service">8.2 Review service</h2>
<p><strong>What it does:</strong> accepts a review from the storefront, checks it, and creates a <strong>draft</strong> <code>review</code> metaobject in Shopify.</p>
<p><strong>Request</strong> (JSON): <code>rating</code> (1 to 5), <code>title</code> (optional), <code>body</code>, <code>productId</code>, <code>photoData</code> (optional compressed JPEG as a data URL), <code>website</code> (honeypot), <code>customerToken</code> (signed proof of sign-in).</p>
<p><strong>What it checks, in order</strong></p>
<ol>
<li>CORS: the request must come from an allowed website (<code>ALLOWED_ORIGINS</code>).</li>
<li>A hidden honeypot field must be empty (bots fill it; they receive a fake success).</li>
<li>Rate limit: 3 requests per minute per IP address (kept in memory, best effort).</li>
<li><strong>Sign-in</strong>: the signed token is verified with <code>REVIEW_SIGNING_SECRET</code> and must be no older than 12 hours (configurable). The name comes from the token.</li>
<li>Rating 1 to 5, text of at least 10 characters, no links.</li>
<li>Optional photo: it must be a compressed JPEG under about 1.2 MB. It is uploaded to Shopify Files and attached to the review.</li>
<li>The draft review is created (<code>approved</code> false, <code>verified</code> false, status Draft, today&#39;s date, the product).</li>
</ol>
<p><strong>Responses:</strong> <code>200 { ok: true }</code>, <code>400</code> invalid input, <code>401</code> not signed in (with a <code>reason</code>), <code>403</code> origin not allowed, <code>405</code> wrong method, <code>429</code> too many requests, <code>500</code> not configured, <code>502</code> Shopify could not save.</p>
<p><strong>Environment variables</strong></p>
<div class="tablewrap"><table><thead><tr>
<th>Variable</th>
<th>Required</th>
<th>Purpose</th>
</tr>
</thead><tbody><tr>
<td><code>SHOPIFY_STORE_DOMAIN</code></td>
<td>yes</td>
<td>The <code>.myshopify.com</code> domain of the store</td>
</tr>
<tr>
<td><code>SHOPIFY_CLIENT_ID</code>, <code>SHOPIFY_CLIENT_SECRET</code></td>
<td>yes (or the token below)</td>
<td>Shopify app credentials. The service exchanges them for a 24-hour Admin API token and refreshes it automatically</td>
</tr>
<tr>
<td><code>SHOPIFY_ADMIN_TOKEN</code></td>
<td>optional fallback</td>
<td>A fixed Admin API token, used if the client credentials are not set</td>
</tr>
<tr>
<td><code>ALLOWED_ORIGINS</code></td>
<td>yes</td>
<td>Comma-separated list of websites allowed to call the service, for example <code>https://shopify-jewelry.bssoln.com</code>. Local testing needs <code>http://127.0.0.1:9292</code></td>
</tr>
<tr>
<td><code>REVIEW_SIGNING_SECRET</code></td>
<td>yes</td>
<td>Must equal the theme setting <em>Review signing secret</em></td>
</tr>
<tr>
<td><code>REVIEW_REQUIRE_LOGIN</code></td>
<td>optional (default <code>true</code>)</td>
<td>Set to <code>false</code> only if you want anyone to review</td>
</tr>
<tr>
<td><code>REVIEW_TOKEN_TTL_HOURS</code></td>
<td>optional (default 12)</td>
<td>How long a sign-in token stays valid</td>
</tr>
<tr>
<td><code>REVIEW_STORE_EMAIL</code></td>
<td>optional (default <code>false</code>)</td>
<td><code>true</code> saves the customer&#39;s email in an <code>email</code> field of the review. <strong>Warning:</strong> the review can be read by the storefront, so the email would become public. Leave it off</td>
</tr>
<tr>
<td><code>DEFAULT_PRODUCT_ID</code></td>
<td>optional</td>
<td>Product used when a review is sent without a product</td>
</tr>
</tbody></table></div>
<p><strong>Shopify permissions needed:</strong> read/write metaobjects (<code>write_metaobjects</code>), and files (<code>write_files</code>) for photos.</p>
<p>See also <a href="#reviews-system" data-doc="reviews-system">7. Reviews system</a>.</p>
<hr>
<h2 id="83-welcome-email">8.3 Welcome email</h2>
<p><strong>What it does:</strong> when someone subscribes to the newsletter (footer or password page) the theme calls this endpoint. It sends a <strong>welcome email</strong> with the discount code through <strong>Gmail SMTP</strong> (Nodemailer).</p>
<ul>
<li>Accepts <code>{ email, name }</code> or a Shopify webhook style payload (<code>customer.email</code>, <code>customer.first_name</code>).</li>
<li>Validates the email address.</li>
<li>Subject: <em>&quot;Welcome to Aurelle — Your 10% Gift Inside&quot;</em>, with a plain-text version and an HTML version (black and gold design with the code, a &quot;Explore The Collection&quot; button and three highlights: waterproof, tarnish-free steel, custom engraved).</li>
<li><code>GET /api/welcome-email</code> returns a small JSON status (&quot;ready&quot;: true when Gmail is configured).</li>
<li>If Gmail is not configured the endpoint answers success in &quot;simulation&quot; mode without sending.</li>
</ul>
<p><strong>Environment variables:</strong> <code>GMAIL_USER</code> (the sending address; default <code>store.bssoln@gmail.com</code>), <code>GMAIL_APP_PASSWORD</code> (a Google <em>app password</em>, not the normal password), <code>WELCOME_DISCOUNT_CODE</code> (default <code>WELCOME10</code>), <code>STORE_URL</code>, <code>ALLOWED_ORIGINS</code>.</p>
<blockquote>
<p><strong>The discount code must exist in Shopify.</strong> The email only displays the code. Create <code>WELCOME10</code> (or the code you set) in <strong>Discounts</strong>, otherwise customers cannot use it.</p>
</blockquote>
<p>The theme calls the service at the address written in <code>snippets/footer-newsletter.liquid</code> and <code>sections/main-password.liquid</code> (see <a href="#maintenance-and-troubleshooting" data-doc="maintenance-and-troubleshooting" data-anchor="values-written-in-code">Maintenance</a>).</p>
<p><strong>Limits:</strong> Gmail restricts how many emails one account can send per day, and Gmail may mark bulk mail as spam. For high volumes move to a transactional email provider.</p>
<hr>
<h2 id="84-email-campaign-tool">8.4 Email campaign tool</h2>
<p><em>(Code in <code>Reviews_API/api/campaign.js</code>; currently not deployed.)</em></p>
<p>A self-contained page that lets the team send a branded email to newsletter subscribers.</p>
<p><strong>What the page offers</strong></p>
<ul>
<li>Fields for <strong>subject</strong>, <strong>heading</strong>, <strong>message</strong>, <strong>discount code</strong>, <strong>button text</strong> and <strong>button link</strong>, and a <strong>preview text</strong>.</li>
<li>A live <strong>preview</strong> in a desktop or mobile frame.</li>
<li><strong>Audience:</strong> all newsletter subscribers (read from Shopify customers who are subscribed to email marketing) or a <strong>custom list</strong> of email addresses.</li>
<li><strong>Send test email</strong> to yourself first, then <strong>Send to all</strong>.</li>
<li>Every email carries an <strong>unsubscribe link</strong> and standard <code>List-Unsubscribe</code> headers.</li>
</ul>
<p><strong>Security (read before deploying).</strong> The page is meant to open only inside Shopify Admin. It checks for the embedded-app address parameters (<code>embedded</code>, <code>host</code>, <code>shop</code>), an iframe request, or a <code>bypass_key</code> parameter, and then issues a 6-hour session token that every send request must include. <strong>These checks only look at the address, they do not verify that the request really came from Shopify.</strong> Anyone who knows the address could add <code>?shop=...</code> and obtain the page and a token, and then email every subscriber. <strong>Do not deploy this tool as it is.</strong> Before using it, a developer must verify Shopify&#39;s signed request (HMAC or session token), or protect the page with a secret, and remove the <code>bypass_key</code> shortcut and the built-in fallback signing string.</p>
<p><strong>Environment variables:</strong> <code>GMAIL_USER</code>, <code>GMAIL_APP_PASSWORD</code>, <code>SHOPIFY_STORE_DOMAIN</code>, <code>SHOPIFY_CLIENT_ID</code> / <code>SHOPIFY_CLIENT_SECRET</code> (or <code>CAMPAIGN_CLIENT_ID</code> / <code>CAMPAIGN_CLIENT_SECRET</code>, or <code>SHOPIFY_ADMIN_TOKEN</code>), <code>CONTACT_EMAIL</code>, <code>EMAIL_LOGO_URL</code>.</p>
<p><strong>Limits</strong></p>
<ul>
<li>It reads only the <strong>first 100</strong> customers from Shopify.</li>
<li>It sends one email at a time, so a very large list can exceed the time a serverless function is allowed to run.</li>
<li>Gmail daily sending limits apply.</li>
</ul>
<hr>
<h2 id="85-unsubscribe-page">8.5 Unsubscribe page</h2>
<p><em>(Code in <code>Reviews_API/api/unsubscribe.js</code>; currently not deployed.)</em></p>
<p>A dark, branded confirmation page (&quot;You have been unsubscribed&quot;) opened from the link at the bottom of campaign emails. It shows the email address.</p>
<blockquote>
<p>The page is only a confirmation: it does not change the customer&#39;s marketing consent in Shopify. To really remove someone from the list, change their email marketing status in <strong>Customers</strong>.</p>
</blockquote>
<hr>
<h2 id="86-shared-email-layout">8.6 Shared email layout</h2>
<p><code>Reviews_API/api/_email-layout.js</code> builds a light, table-based, inline-styled email (works in Gmail, Apple Mail and Outlook) with the Aurelle name and tagline, cream and gold colors, and a footer with the contact email. Settings: <code>CONTACT_EMAIL</code>, <code>EMAIL_LOGO_URL</code>. It is used by the campaign tool and by the alternative welcome email.</p>
<hr>
<h2 id="87-merging-and-deploying">8.7 Merging and deploying</h2>
<p><strong>Deploying (from the folder that should be live):</strong></p>
<ol>
<li>Install the Vercel CLI (<code>npm i -g vercel</code>) and sign in (<code>vercel login</code>).</li>
<li>In the service folder run <code>vercel --prod</code>. The folder is already linked to the project (<code>.vercel/project.json</code>).</li>
<li>After deploying check: <code>GET /api/welcome-email</code> should return <code>&quot;ready&quot;: true</code>, and a <code>POST /api/review</code> with an empty body should answer <code>401</code> with a <code>reason</code>.</li>
</ol>
<p><strong>Recommended clean-up (a developer task)</strong></p>
<ol>
<li>Choose <strong>one</strong> folder (the theme repository&#39;s <code>reviews-api/</code> is the natural home).</li>
<li>Copy <code>campaign.js</code>, <code>unsubscribe.js</code> and <code>_email-layout.js</code> into its <code>api/</code> folder. Decide which <code>welcome-email.js</code> you want (dark layout without unsubscribe link, or the light layout with unsubscribe link).</li>
<li>Keep the <strong>new</strong> <code>review.js</code> (do not copy the old one).</li>
<li>Add <code>nodemailer</code> to <code>package.json</code> dependencies (the current <code>reviews-api/package.json</code> lists none, although <code>welcome-email.js</code> needs it).</li>
<li>Remove the hard-coded fallback signing string in <code>campaign.js</code> and rely on a real secret.</li>
<li>Deploy, then run the checks above.</li>
</ol>
<p><strong>Environment variables</strong> are added in Vercel &gt; Project &gt; Settings &gt; Environment Variables (Production), or with <code>vercel env add NAME production</code>, and take effect after the next deployment. A template is in <code>reviews-api/.env.example</code>.</p>
<hr>
<h2 id="88-security-notes">8.8 Security notes</h2>
<ul>
<li>Never commit real tokens, secrets or Gmail passwords. <code>.env.local</code> is for local use only and should stay out of Git.</li>
<li>The service accepts calls only from the origins in <code>ALLOWED_ORIGINS</code>.</li>
<li>The signing secret lives in two places (Vercel and Theme settings). Theme settings can be read by theme editors, so give theme access only to trusted people.</li>
<li>Use a Google <strong>app password</strong> for Gmail, never the account password.</li>
<li>Review the Shopify app scopes regularly and keep only the permissions that are needed.</li>
</ul>

<h2 id="103-catalog-importer-web-app">10.3 Catalog importer web app</h2>
<p><strong>Location:</strong> <code>shopify-catalog-importer/</code> · <strong>Built by:</strong> BSS · <strong>Hosting:</strong> runs on any computer, or on Vercel.</p>
<p><strong>Why it exists.</strong> Normal importers fail with big batches of images because of server size limits (Vercel allows about 4.5 MB per request). This app lets the <strong>browser upload the images directly to Shopify&#39;s storage</strong>, so batches of 1,000+ images work.</p>
<p><strong>What it does</strong></p>
<ol>
<li>Connects to <strong>any Shopify store</strong> with its domain and an Admin API token (needs <code>read_products</code>, <code>write_products</code>, <code>read_files</code>, <code>write_files</code>) and shows the store name, currency and plan.</li>
<li>Reads your <strong>product CSV</strong> and the <strong>images folder</strong>. An optional <strong>position map CSV</strong> says which picture is first, second, third. Without it, file names containing <code>_01-Hero</code>, <code>_02-Lifestyle</code>, <code>_03-Macro</code> are matched.</li>
<li>Creates upload targets in Shopify, <strong>streams the images from the browser</strong> to Shopify, registers them in <strong>Shopify Files</strong> and records the real <code>cdn.shopify.com</code> addresses.</li>
<li>Fills the empty <code>Image Src</code> columns of your CSV with those addresses and lets you <strong>download the completed CSV</strong>.</li>
<li>Optionally <strong>creates the products directly</strong> (as Draft or Active) with images, variants and EUR prices, using Shopify&#39;s <code>productSet</code>.</li>
<li>Can also create or check collections.</li>
</ol>
<p><strong>Run it on your computer</strong></p>
<pre><code class="language-bash">cd shopify-catalog-importer
npm install
npm start          # then open http://localhost:3000
</code></pre>
<p><strong>Deploy to Vercel:</strong> <code>npx vercel --prod</code> from the folder (or import the repository in Vercel).</p>
<p><strong>Folders:</strong> <code>api/index.js</code> (the server and Vercel entry), <code>lib/shopify.js</code> (Shopify GraphQL calls), <code>lib/csvHelper.js</code> (CSV reading and writing), <code>public/</code> (the dashboard page), <code>sample_data/</code> (example CSVs and images).</p>
<blockquote>
<p>The token you type is sent to Shopify through this app. Use it only on a computer or deployment you control, and rotate the token afterwards if it was shared.</p>
</blockquote>
<hr>
<h2 id="104-importing-products-the-two-ways">10.4 Importing products: the two ways</h2>
<p><strong>A. Shopify Admin import (fastest for bulk):</strong> Products &gt; Import &gt; upload a CSV. The CSV must follow Shopify&#39;s product CSV format (handle, title, body, vendor, type, tags, options, variants, SKU, price, image URLs). Images must already be reachable by URL (for example uploaded to Shopify Files first). Multi-variant products repeat the handle on each row.</p>
<p><strong>B. Programmatic import:</strong> the catalog importer app, or GraphQL calls through the Shopify CLI. The step-by-step version with commands is in <code>PRODUCT_IMPORT_CLI_GUIDE.md</code> (English) and <code>CLI_CATALOG_IMPORT_WORKFLOW_BN.md</code> (Bengali).</p>
<p><strong>Image guidelines for jewelry (from the guide):</strong> use the same square ratio for every product, a clean &quot;hero&quot; shot first, a lifestyle shot second and a macro/detail shot third. Keep files small (WebP under about 110 KB) so pages stay fast.</p>

<h3 id="everyday-commands">Everyday commands</h3>
<div class="tablewrap"><table><thead><tr>
<th>Task</th>
<th>Command</th>
</tr>
</thead><tbody><tr>
<td>Preview the theme locally with live reload</td>
<td><code>shopify theme dev --store your-store.myshopify.com</code> (opens <code>http://127.0.0.1:9292</code>)</td>
</tr>
<tr>
<td>Check the code for mistakes</td>
<td><code>shopify theme check</code></td>
</tr>
<tr>
<td>List the themes of the store</td>
<td><code>shopify theme list --store your-store.myshopify.com</code></td>
</tr>
<tr>
<td>Download the live theme (backup)</td>
<td><code>shopify theme pull --store ... --theme &lt;id&gt;</code></td>
</tr>
<tr>
<td>Upload your work to a theme</td>
<td><code>shopify theme push --store ... --theme &lt;id&gt;</code></td>
</tr>
</tbody></table></div>
<p><code>shopify theme dev</code> creates a private <strong>development theme</strong> in the store and uploads your files to it. It is safe: customers never see it. A development theme that is no longer needed can be deleted in Online Store &gt; Themes.</p>
<h3 id="the-golden-rules">The golden rules</h3>
<ol>
<li><strong>Never edit the live theme directly.</strong> Work in a development theme or a duplicate, then publish.</li>
<li><strong>Keep a backup</strong> before big changes: Online Store &gt; Themes &gt; three dots &gt; <strong>Duplicate</strong>, or <code>shopify theme pull</code>.</li>
<li><strong>Commit to Git often</strong> with clear messages. At the time of writing there are many uncommitted changes in the working folder. Commit and push them so nothing is lost.</li>
<li>Theme editor changes (colors, text, sections) are stored in <code>config/settings_data.json</code> and <code>templates/*.json</code>. If you pull from the store before editing locally you will not overwrite them.</li>
<li>After changing a section&#39;s <code>{% schema %}</code>, check it in the theme editor (the settings must still open).</li>
<li>Test on <strong>mobile and desktop</strong> and in the <strong>theme editor</strong> (some sections behave differently there).</li>
</ol>
<h3 id="code-conventions-used-in-this-project">Code conventions used in this project</h3>
<ul>
<li>Custom CSS classes and variables start with <code>lv-</code> (older name of the project).</li>
<li>Custom storage keys start with <code>bss_</code>.</li>
<li>Snippets and blocks that are rendered by other files start with a <code>{% doc %}</code> header describing the parameters.</li>
<li>Section styles live inside the section file in a <code>&lt;style&gt;</code> block, scoped with the section id.</li>
<li>Texts shown to customers should use translation keys (<code>{{ &#39;key&#39; | t }}</code>) from <code>locales/en.default.json</code>. Some older areas still contain English text written directly in the code.</li>
</ul>
<hr>
<h2 id="updating-and-publishing-safely">Updating and publishing safely</h2>
<ol>
<li>Make the change in a development theme.</li>
<li>Run <code>shopify theme check</code>.</li>
<li>Preview in the browser, desktop and mobile. Check the flows listed in the checklist below.</li>
<li>Push to a <strong>duplicate</strong> of the live theme, preview that.</li>
<li><strong>Publish</strong> the duplicate (the previous live theme becomes your instant rollback).</li>
</ol>
<h3 id="rollback">Rollback</h3>
<p>Online Store &gt; Themes &gt; find the previous theme &gt; <strong>Publish</strong>. This takes effect immediately.</p>

</tr>

</tr>
<tr>

</tr>

</tr>
<tr>

<tr>

<h2 id="performance-and-quality-tips">Performance and quality tips</h2>
<ul>
<li>Use <strong>WebP/JPEG</strong> images, around 1600 px wide for banners, and compress them. Short, compressed videos only.</li>
<li>Avoid adding many apps; each adds scripts to every page.</li>
<li>Keep the number of sections on the home page reasonable; the page scrolls through many images.</li>
<li>Run Google PageSpeed Insights on the home, a collection and a product page after big changes.</li>
<li>Do not put secrets in the theme code, the announcement HTML or Custom CSS. Everything in the theme is visible to visitors.</li>
</ul>
<hr>
<h2 id="security-and-access">Security and access</h2>
<ul>
<li>Give <strong>staff accounts</strong> only the permissions they need. Theme editors can read theme settings.</li>
<li>Keep the Vercel project, the Shopify custom app credentials and the Gmail app password with the owner/BSS only.</li>
<li>Rotate the <strong>Review signing secret</strong> and Shopify app secrets if anyone with access leaves.</li>
<li>Keep <code>.env</code> and <code>.env.local</code> files out of Git (they are listed in <code>.gitignore</code>).</li>
</ul>

<h2 id="faq">FAQ</h2>
<h3 id="design-and-content">Design and content</h3>
<p><strong>How do I change the colors of the whole store?</strong>
Theme settings &gt; <strong>Theme Palette</strong> &gt; choose a palette (Champagne Gold, Rose Gold, Platinum, Emerald, Midnight) or Custom. See <a href="#design-and-settings-guide" data-doc="design-and-settings-guide">Design and settings guide</a>.</p>
<p><strong>How do I change the banner on the home page?</strong>
Customize &gt; Home page &gt; <strong>Homepage banner</strong> &gt; the <strong>Slide</strong> block. See <a href="#store-owner-guide" data-doc="store-owner-guide" data-anchor="22-home-page">Store owner guide</a>.</p>
<p><strong>Can I add a new section to a page?</strong>
Yes: Customize &gt; open the page &gt; <strong>Add section</strong>. The available sections are listed in the <a href="#sections-guide" data-doc="sections-guide">Sections guide</a>.</p>
<p><strong>Can I have different banners on desktop and mobile?</strong>
Yes. Banners and tiles have separate desktop and mobile images/videos.</p>
<p><strong>Where do I change the menu?</strong>
<strong>Content &gt; Menus</strong>. Pictures and dropdown style are in the Header section.</p>
<p><strong>Why does my change not show on the website?</strong>
Click <strong>Save</strong> in the editor, and check you are editing the live (published) theme.</p>
<p><strong>How do I go back if something breaks?</strong>
Online Store &gt; Themes: publish the previous theme copy. Keep a duplicate before big changes.</p>
<h3 id="products-and-shopping">Products and shopping</h3>
<p><strong>How do I make a product engravable?</strong>
Put a keyword (engrav, personali) in the title, type or tags, or add an option named like &quot;Engraving characters&quot;. See <a href="#custom-features" data-doc="custom-features" data-anchor="61-custom-engraving">Custom engraving</a>.</p>
<p><strong>How is the engraving price calculated?</strong>
By variants: each &quot;characters&quot; option value (3, 5, 7, 10, 12) is a variant with its own price.</p>
<p><strong>Where do customers see the engraving text?</strong>
In the cart, the cart drawer, the order and the order emails, as a line item property.</p>
<p><strong>How do I create a sale?</strong>
Set the <strong>compare-at price</strong> above the price. The sale badge appears automatically. Colors and style are in Theme settings &gt; Price &amp; Badges.</p>
<p><strong>Can I change the free-shipping amount?</strong>
It is written in the code, so a developer must change it in several places. See <a href="#maintenance-and-troubleshooting" data-doc="maintenance-and-troubleshooting" data-anchor="values-written-in-code">Maintenance &gt; Values written in code</a>.</p>
<p><strong>Why do some product cards show a &quot;Personalise&quot; bar instead of sizes?</strong>
Because the product is engravable. The button opens a pop-up with the engraving field.</p>
<p><strong>Does the wishlist work across devices?</strong>
No. It is saved in the browser of each device.</p>
<h3 id="reviews">Reviews</h3>
<p><strong>Who can write a review?</strong>
Only customers who are signed in.</p>
<p><strong>Where do I approve reviews?</strong>
Content &gt; Metaobjects &gt; Review. Set the status to Active.</p>
<p><strong>Can I choose how reviews look?</strong>
Yes, Theme settings &gt; Reviews &gt; Review card layout (eight designs).</p>
<p><strong>Why can&#39;t customers submit reviews?</strong>
See the troubleshooting table in the <a href="#reviews-system" data-doc="reviews-system" data-anchor="78-troubleshooting">Reviews system</a>.</p>
<h3 id="emails-and-marketing">Emails and marketing</h3>
<p><strong>How are the order emails styled?</strong>
With the 17 branded templates pasted into Settings &gt; Notifications. See <a href="#email-templates" data-doc="email-templates">Email templates</a>.</p>
<p><strong>What happens when someone subscribes to the newsletter?</strong>
Shopify saves them as a customer with marketing consent and the tag &quot;newsletter&quot;, and the welcome email service sends them the discount code.</p>
<p><strong>Does the discount code in the email work automatically?</strong>
Only if the same code exists in <strong>Discounts</strong>.</p>
<p><strong>How do I send a campaign?</strong>
With the campaign tool (see <a href="#backend-services" data-doc="backend-services" data-anchor="84-email-campaign-tool">Backend services</a>). It is currently not deployed.</p>
<h3 id="technical">Technical</h3>
<p><strong>Where is the code stored?</strong>
The theme: the Git repository <code>Jewelry-Shop-i-fy</code>. The backend: the folders <code>reviews-api</code> and <code>Reviews_API</code>.</p>
<p><strong>What is hosted outside Shopify?</strong>
The review and welcome-email services on Vercel (<code>your-reviews-service.vercel.app</code>).</p>
<p><strong>Who do I contact for changes?</strong>
BSS Software Solutions, <a href="https://bssoln.com" target="_blank" rel="noopener noreferrer">https://bssoln.com</a>, <a href="mailto:info@bssoln.com" target="_blank" rel="noopener noreferrer">info@bssoln.com</a>.</p>

<template id="t-s-announcement"><h1 id="announcement-bar">Announcement bar</h1>
<blockquote>
<p><strong>File:</strong> <code>sections/announcement.liquid</code> · <strong>Area:</strong> Header &amp; footer · <strong>Size:</strong> 304 lines</p>

<h2 id="what-it-does">What it does</h2>
<p>The thin bar at the very top of every page. It shows one or more short messages (for example &quot;Free shipping from €39&quot; or a sale code) and rotates through them automatically. Each message is a block, so you can add, reorder or remove messages without touching code.</p>
<p><strong>Typical uses</strong></p>
<ul>
<li>Promote a sale, a discount code or a shipping offer.</li>
<li>Show several messages that rotate every few seconds.</li>
<li>Use the &quot;Custom HTML&quot; field of a block for a more designed, animated message (sparkles, gold shimmer, copy-to-clipboard code).</li>
</ul>
<h2 id="where-it-appears">Where it appears</h2>
<ul>
<li>Header group (every page)</li>
</ul>
<h2 id="how-to-edit-it">How to edit it</h2>
<ol>
<li>Open <strong>Online Store &gt; Themes &gt; Customize</strong>.</li>
<li>Scroll to the very top (header group) or bottom (footer group) of any page and click the section.</li>
<li>Change the settings on the left; changes preview live. Click <strong>Save</strong>.</li>
</ol>

<template id="t-ref-theme-architecture"><h1 id="theme-architecture-for-developers">Theme architecture (for developers)</h1>
<p>How the theme is put together, so a developer can find things quickly.</p>
<h2 id="1-from-request-to-page">1. From request to page</h2>
<pre><code>Browser requests /products/some-ring
        │
Shopify picks the TEMPLATE        templates/product.json
        │                         (an ordered list of sections + their settings)
        ▼
layout/theme.liquid  ── wraps every page
   &lt;head&gt;   SEO tags · fonts · CSS variables · stylesheets · global snippets
   &lt;body&gt;   {% sections &#39;header-group&#39; %}     → announcement, header
            {{ content_for_layout }}          → the template&#39;s sections
            {% sections &#39;footer-group&#39; %}     → footer, subfooter
            search popdown · cart drawer · quick view modal
   scripts  vendor.js · theme.js · banner.js
</code></pre>
<ul>
<li><strong>Templates</strong> (<code>templates/*.json</code>) only list sections and their saved settings. They are rewritten by the theme editor. <code>templates/customers/*.liquid</code> and <code>templates/gift_card.liquid</code> are plain Liquid templates.</li>
<li><strong>Sections</strong> (<code>sections/*.liquid</code>) contain the markup, a scoped <code>&lt;style&gt;</code> block, optional <code>&lt;script&gt;</code>, and a <code>{% schema %}</code> that defines the editor settings and blocks.</li>
<li><strong>Snippets</strong> (<code>snippets/*.liquid</code>) are rendered with <code>{% render &#39;name&#39;, param: value %}</code>. They cannot see variables of their parent unless passed in. Most start with a <code>{% doc %}</code> header that lists the parameters.</li>
<li><strong>There is no <code>blocks/</code> folder.</strong> All repeatable items are section blocks (defined in each section&#39;s schema).</li>
</ul>
<h2 id="2-what-layoutthemeliquid-does-in-order">2. What <code>layout/theme.liquid</code> does, in order</h2>
<ol>
<li>Meta tags, canonical URL, favicon, page title (page + tags + page number + shop name), meta description (with an Aurelle default on the home page).</li>
<li><code>social-meta-tags</code> (Open Graph / Twitter).</li>
<li><code>theme-typography</code> (part <code>head</code>): loads the chosen Google/Shopify fonts.</li>
<li><code>font-settings.css</code>, <code>css-variables</code> (design tokens), <code>theme.css</code>, <code>banner.css</code>, <code>product-grid.css</code>.</li>
<li>An inline <code>&lt;style&gt;</code> block that generates:<ul>
<li>the <strong>color schemes</strong>: for every scheme in Theme settings a <code>.color-scheme-N</code> class with <code>--bg</code>, <code>--text</code>, button and border variables;</li>
<li>the <strong>palette</strong> variables <code>--lv-ivory</code>, <code>--lv-cream</code>, <code>--lv-sand</code>, <code>--lv-ink</code>, <code>--lv-dark</code>, <code>--lv-line</code>, <code>--lv-accent-deep</code>, <code>--lv-accent-light</code>;</li>
<li>global typography, heading, button and input rules driven by Theme settings;</li>
<li>pre-hydration layout constraints so product cards do not &quot;explode&quot; before JS runs.</li>
</ul>
</li>
<li>Global snippets: <code>custom-button-animations</code>, <code>loading-states</code>, <code>policy-page-css</code>, <code>cookie-banner-css</code>, <code>button-fill-slide</code> (when enabled), <code>sale-badge-css</code>, <code>card-mini-add-assets</code>.</li>
<li>An inline script that defines the global <strong><code>theme</code></strong> object (routes, sizes, strings, settings such as <code>currency_code_enable</code>, <code>currencyCode</code>, <code>moneyFormat</code>) and loads PhotoSwipe, smooth-scroll and swatch data from <code>assets</code>.</li>
<li><code>{{ content_for_header }}</code>, then <code>vendor.js</code>, <code>theme.js</code>, <code>banner.js</code> (deferred).</li>
<li>Body: header group, <code>&lt;main&gt;</code>, footer group, <code>search-predictive</code> (popdown style), <code>cart-drawer</code>, <code>quick-view-modal</code>.</li>
</ol>
<p><code>layout/password.liquid</code> is a lighter frame for the password page (typography, buttons, its own styles and scripts).</p>
<h2 id="3-the-design-token-pipeline">3. The design-token pipeline</h2>
<pre><code>Theme settings (config/settings_data.json)
   ├─ Theme Palette preset ─────► palette hexes ─► --lv-* variables  ─┐
   ├─ Colors (5 schemes) ───────► .color-scheme-N classes ───────────┤
   ├─ Typography ───────────────► theme-typography ─► font variables ┼─► used by every section
   ├─ Buttons &amp; Controls ───────► --btn-* variables ─────────────────┤
   └─ Product Card / Price ... ─► snippet logic and CSS variables ───┘
</code></pre>
<ul>
<li>A section adds <code>class=&quot;color-{{ section.settings.color_scheme }}&quot;</code> and then uses <code>var(--bg)</code>, <code>var(--text)</code>, <code>var(--lv-accent-deep)</code> etc., so it follows palette changes automatically.</li>
<li>When <strong>Theme Palette</strong> is on, the palette overrides the stored scheme values. Turn <code>palette_control</code> off to use the hand-edited schemes.</li>
<li>Buttons are styled in two layers: the Pipeline framework (<code>theme.css</code>) and the project&#39;s <code>custom-button-animations</code> snippet (which uses <code>!important</code> heavily to win). Section-level custom buttons set the <code>--btn-base-*</code> and <code>--btn-regular-hover-*</code> variables locally.</li>
</ul>
<h2 id="4-javascript">4. JavaScript</h2>
<div class="tablewrap"><table><thead><tr>
<th>Piece</th>
<th>What it is</th>
</tr>
</thead><tbody><tr>
<td><code>assets/theme.js</code></td>
<td>Pipeline framework bundle (AOS, Flickity, MicroModal, Rellax, axios, Sqrl, theme currency/addresses helpers) plus the framework&#39;s cart, header, product and section logic. It dispatches DOM events such as <code>theme:cart:change</code>, <code>theme:cart:init</code>, <code>theme:cart:reload</code>, <code>theme:drawer:open/close/toggle</code>, <code>theme:cart-item:added/updated</code></td>
</tr>
<tr>
<td><code>assets/vendor.js</code>, <code>photoswipe.js</code>, <code>smoothscroll.js</code></td>
<td>Third-party libraries</td>
</tr>
<tr>
<td><code>assets/banner.js</code></td>
<td>Banner video playback, slide rotation, scroll cue</td>
</tr>
<tr>
<td><code>assets/product-showcase.js</code></td>
<td>Custom elements <code>&lt;product-showcase-slider&gt;</code>, <code>&lt;showcase-video&gt;</code>, <code>&lt;split-showcase-banner&gt;</code></td>
</tr>
<tr>
<td>Inline <code>&lt;script&gt;</code> in snippets and sections</td>
<td>Feature code: cart drawer (<code>syncCartDrawerUI</code>, remove confirmation, clear all, <code>window.addToCartAjax</code>), quick view, card mini add popup, review form, account dashboard, product page (gallery, variants, engraving), predictive search</td>
</tr>
</tbody></table></div>
<p><strong>Cart updates</strong> use Shopify&#39;s AJAX cart (<code>/cart/add.js</code>, <code>/cart/change.js</code>, <code>/cart/clear.js</code>, <code>/cart.js</code>) and the <strong>Section Rendering API</strong> (<code>?section_id=api-cart-subtotal</code>, <code>api-cart-items</code>). Search suggestions use <code>predictive_search_url</code> and the <code>predictive-search</code> section.</p>
<p><strong>Storage:</strong> the wishlist uses <code>localStorage</code> keys <code>bss_wishlist</code> and <code>bss_wishlist_products</code>. No cookies are set by the custom code besides Shopify&#39;s own.</p>
<p><strong>Theme editor events:</strong> several sections re-initialize on <code>shopify:section:load</code> so they work while editing.</p>
<h2 id="5-css-organization-and-prefixes">5. CSS organization and prefixes</h2>
<div class="tablewrap"><table><thead><tr>
<th>Prefix</th>
<th>Area</th>
</tr>
</thead><tbody><tr>

<ul>
<li>Section CSS is scoped with the section id (<code>#cf-{{ section.id }}</code>) or a unique class.</li>
